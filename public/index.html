<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京大社情 Study Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ===== CSS Variables - Warm Theme ===== */
:root {
  --bg: #faf7f2;
  --bg-card: #ffffff;
  --bg-card-alt: #fefcf8;
  --bg-warm: #f5f0e8;
  --bg-hover: #f0ebe1;
  --border: #e8e0d4;
  --border-light: #f0e8dc;
  --text: #2d2a26;
  --text-secondary: #7a7268;
  --text-muted: #a39b8f;
  --accent: #e07a3a;
  --accent-light: #fdf0e6;
  --accent-hover: #c96a2f;
  --green: #4caf7d;
  --green-light: #e8f5e9;
  --yellow: #f5b731;
  --yellow-light: #fff8e1;
  --red: #e55b4d;
  --red-light: #ffeee9;
  --blue: #5b8def;
  --blue-light: #e8f0fe;
  --purple: #9575cd;
  --shadow-sm: 0 1px 3px rgba(45,42,38,0.06);
  --shadow-md: 0 4px 12px rgba(45,42,38,0.08);
  --shadow-lg: 0 8px 24px rgba(45,42,38,0.1);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 6px;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Layout ===== */
.dashboard { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

/* ===== Header ===== */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding: 20px 28px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }
.header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
.header-left p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.countdown-box { text-align: center; padding: 8px 24px; background: linear-gradient(135deg, var(--accent-light), #fff5ec); border-radius: var(--radius-sm); border: 1px solid #f0dcc8; }
.countdown-days { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.countdown-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

/* ===== Stats Grid ===== */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius); padding: 18px 20px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); transition: box-shadow 0.2s; }
.stat-card:hover { box-shadow: var(--shadow-md); }
.stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 10px; }
.stat-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

/* ===== Main Grid ===== */
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

/* ===== Card Component ===== */
.card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border-light); }
.card-title { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
.card-title .icon { font-size: 16px; }
.card-badge { font-size: 11px; padding: 2px 8px; background: var(--bg-warm); color: var(--text-secondary); border-radius: 20px; font-weight: 500; }
.card-body { padding: 16px 20px; }

/* ===== Timer Section ===== */
.timer-section { grid-column: 1 / -1; }
.timer-layout { display: grid; grid-template-columns: 360px 1fr; gap: 0; }
.timer-panel { padding: 24px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; align-items: center; }
.timer-subjects { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.timer-subject-btn { padding: 6px 16px; border: 2px solid var(--border); border-radius: 20px; background: var(--bg-card); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; display: flex; align-items: center; gap: 5px; color: var(--text-secondary); }
.timer-subject-btn:hover { border-color: var(--accent); color: var(--accent); }
.timer-subject-btn.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.timer-display { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 700; color: var(--text); letter-spacing: 2px; margin: 8px 0 20px; line-height: 1; }
.timer-display.running { color: var(--accent); }
.timer-controls { display: flex; gap: 10px; }
.timer-btn { padding: 10px 32px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.timer-btn.start { background: var(--green); color: #fff; }
.timer-btn.start:hover { background: #43a070; }
.timer-btn.stop { background: var(--red); color: #fff; }
.timer-btn.stop:hover { background: #d04a3d; }
.timer-btn.reset { background: var(--bg-warm); color: var(--text-secondary); }
.timer-btn.reset:hover { background: var(--bg-hover); }

/* Timer - Active Item Display */
.timer-active-item { margin-top: 16px; padding: 10px 16px; background: var(--accent-light); border-radius: var(--radius-sm); border: 1px solid #f0dcc8; text-align: center; width: 100%; max-width: 320px; }
.timer-active-item .label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.timer-active-item .item-name { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer-active-item.empty { background: var(--bg-warm); border-color: var(--border); }
.timer-active-item.empty .label { color: var(--text-muted); }
.timer-active-item.empty .item-name { color: var(--text-secondary); font-weight: 400; }

/* Timer - Review Queue Panel */
.review-queue-panel { display: flex; flex-direction: column; max-height: 420px; }
.review-queue-header { padding: 14px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.review-queue-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.review-queue-filters { display: flex; gap: 6px; }
.review-filter-btn { padding: 3px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg-card); cursor: pointer; font-family: inherit; color: var(--text-secondary); font-weight: 500; transition: all 0.15s; }
.review-filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.review-filter-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.review-queue-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
.review-queue-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; border: 2px solid transparent; margin-bottom: 4px; }
.review-queue-item:hover { background: var(--bg-warm); }
.review-queue-item.selected { background: var(--accent-light); border-color: var(--accent); }
.review-queue-item.completed { opacity: 0.5; text-decoration: line-through; }
.rq-subject { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px; }
.rq-subject.CS { background: #fef3e2; color: #c17a1e; }
.rq-subject.AI { background: #e8f5e9; color: #388e3c; }
.rq-subject.HCI { background: #fce4ec; color: #c62828; }
.rq-subject.SE { background: #f3e5f5; color: #7b1fa2; }
.rq-subject.IR { background: #e3f2fd; color: #1565c0; }
.rq-name { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rq-priority { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
.rq-priority.S { background: var(--red-light); color: var(--red); }
.rq-priority.A { background: #fff3e0; color: #e65100; }
.rq-priority.B { background: var(--yellow-light); color: #f57f17; }
.rq-priority.C { background: var(--green-light); color: var(--green); }
.rq-mastery { font-size: 14px; flex-shrink: 0; }

/* Review completion modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(45,42,38,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: var(--bg-card); border-radius: var(--radius); padding: 28px; width: 420px; max-width: 90vw; box-shadow: var(--shadow-lg); transform: translateY(10px); transition: transform 0.2s; }
.modal-overlay.show .modal { transform: translateY(0); }
.modal h3 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }
.modal-field { margin-bottom: 14px; }
.modal-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.modal-field select, .modal-field textarea, .modal-field input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 14px; background: var(--bg-card); color: var(--text); }
.modal-field textarea { resize: vertical; min-height: 60px; }
.modal-mastery-btns { display: flex; gap: 8px; }
.mastery-btn { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; }
.mastery-btn:hover { border-color: var(--accent); }
.mastery-btn.selected { border-color: var(--accent); background: var(--accent-light); }
.mastery-btn .emoji { font-size: 24px; display: block; margin-bottom: 4px; }
.mastery-btn .text { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions button { flex: 1; padding: 10px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.modal-actions .cancel { background: var(--bg-warm); color: var(--text-secondary); }
.modal-actions .submit { background: var(--accent); color: #fff; }
.modal-actions .submit:hover { background: var(--accent-hover); }

/* ===== Heatmap ===== */
.heatmap-section { grid-column: 1 / -1; }
.heatmap-wrapper { padding: 16px 20px; overflow-x: auto; }
.heatmap-grid { display: flex; gap: 3px; }
.heatmap-days-labels { display: flex; flex-direction: column; gap: 3px; margin-right: 4px; font-size: 9px; color: var(--text-muted); }
.heatmap-days-labels span { height: 13px; display: flex; align-items: center; }
.heatmap-week { display: flex; flex-direction: column; gap: 3px; }
.heatmap-day { width: 13px; height: 13px; border-radius: 3px; background: var(--bg-warm); transition: all 0.15s; position: relative; }
.heatmap-day:hover { transform: scale(1.3); z-index: 1; }
.heatmap-day[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding: 4px 8px; background: var(--text); color: #fff; font-size: 10px; border-radius: 4px; white-space: nowrap; pointer-events: none; z-index: 2; }
.heatmap-day.l1 { background: #e0d5c3; }
.heatmap-day.l2 { background: #f5c882; }
.heatmap-day.l3 { background: #e8a44a; }
.heatmap-day.l4 { background: var(--accent); }
.heatmap-day.today { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ===== Mastery Progress ===== */
.mastery-subject { margin-bottom: 14px; }
.mastery-subject:last-child { margin-bottom: 0; }
.mastery-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mastery-subject-name { font-size: 13px; font-weight: 600; }
.mastery-counts { font-size: 11px; color: var(--text-muted); }
.mastery-bar { height: 10px; border-radius: 5px; background: var(--bg-warm); overflow: hidden; display: flex; }
.mastery-bar .seg-green { background: var(--green); }
.mastery-bar .seg-yellow { background: var(--yellow); }
.mastery-bar .seg-red { background: var(--red); }

/* ===== Due Today List (Alternative style) ===== */
.due-list { max-height: 350px; overflow-y: auto; }
.due-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.due-item:last-child { border-bottom: none; }
.due-subject { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.due-subject.CS { background: #fef3e2; color: #c17a1e; }
.due-subject.AI { background: #e8f5e9; color: #388e3c; }
.due-subject.HCI { background: #fce4ec; color: #c62828; }
.due-subject.SE { background: #f3e5f5; color: #7b1fa2; }
.due-subject.IR { background: #e3f2fd; color: #1565c0; }
.due-name { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== Phase Progress ===== */
.phase-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.phase-item:last-child { border-bottom: none; }
.phase-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.phase-num.p1 { background: var(--blue); }
.phase-num.p2 { background: var(--green); }
.phase-num.p3 { background: var(--red); }
.phase-num.p4 { background: var(--purple); }
.phase-info { flex: 1; }
.phase-name { font-size: 13px; font-weight: 600; }
.phase-meta { font-size: 11px; color: var(--text-muted); }
.phase-bar-bg { height: 6px; background: var(--bg-warm); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.phase-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

/* ===== Weekly Plan ===== */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week-day { text-align: center; padding: 10px 4px; border-radius: var(--radius-sm); background: var(--bg-card-alt); border: 1px solid var(--border-light); transition: all 0.15s; }
.week-day.today { background: var(--accent-light); border-color: var(--accent); }
.week-day-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
.week-day-date { font-size: 18px; font-weight: 700; margin: 4px 0; color: var(--text); }
.week-day.today .week-day-date { color: var(--accent); }
.week-day-tasks { font-size: 10px; color: var(--text-secondary); line-height: 1.4; }

/* ===== Recent Logs ===== */
.log-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.log-item:last-child { border-bottom: none; }
.log-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); flex-shrink: 0; width: 75px; }
.log-title { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-time { font-size: 12px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }

/* ===== Toast & Loading ===== */
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; background: var(--text); color: #fff; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 2000; transform: translateY(80px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }
.loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .main-grid { grid-template-columns: 1fr; }
  .timer-layout { grid-template-columns: 1fr; }
  .timer-panel { border-right: none; border-bottom: 1px solid var(--border-light); }
  .review-queue-panel { max-height: 300px; }
  .week-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 600px) {
  .dashboard { padding: 12px 10px 40px; }
  .header { flex-direction: column; gap: 12px; text-align: center; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .timer-display { font-size: 48px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── Constants & Setup ───
const API = "/api/notion";
const EXAM = new Date("2026-08-10");
const SUBJECTS = [
  { id: "CS", name: "CS 情報学基礎", color: "#c17a1e", icon: "💻" },
  { id: "AI", name: "AI 人工知能", color: "#388e3c", icon: "🤖" },
  { id: "HCI", name: "HCI 人机交互", color: "#c62828", icon: "🖱️" },
  { id: "SE", name: "SE 软件工程", color: "#7b1fa2", icon: "⚙️" },
  { id: "IR", name: "IR 情報検索", color: "#1565c0", icon: "🔍" },
];
const PHASES = [
  { id: "p1", name: "Phase 1: 基础扫盲", start: "2026-02-19", end: "2026-04-15", color: "var(--blue)" },
  { id: "p2", name: "Phase 2: 过去问攻略", start: "2026-04-16", end: "2026-06-15", color: "var(--green)" },
  { id: "p3", name: "Phase 3: 弱点强化", start: "2026-06-16", end: "2026-07-20", color: "var(--red)" },
  { id: "p4", name: "Phase 4: 冲刺", start: "2026-07-21", end: "2026-08-10", color: "var(--purple)" },
];

const WEEK_PLAN = {
  1: ['CS 基础', 'AI 知识点'], 2: ['HCI 过去问', 'SE 知识点'], 3: ['CS 过去问', 'IR 知识点'],
  4: ['AI 过去问', 'HCI 知识点'], 5: ['SE 过去问', 'CS 弱点'], 6: ['全科过去问', '弱点攻克'], 0: ['自由复习', '整理笔记'],
};

const todayStr = () => new Date().toISOString().split("T")[0];
const daysLeft = () => Math.ceil((EXAM - new Date()) / 864e5);
const formatTime = (sec) => `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;

async function api(action, body) {
  const r = await fetch(`${API}?action=${action}`, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

// ─── React Components ───

// Toast Component
function Toast({ msg, type, onClose }) {
  useEffect(() => {
    if (!msg) return;
    const timer = setTimeout(onClose, 3000);
    return () => clearTimeout(timer);
  }, [msg, onClose]);
  return <div className={`toast ${msg ? "show" : ""} ${type || ""}`}>{msg}</div>;
}

// Modal Component
function ReviewModal({ show, item, initialMinutes, onClose, onSubmit }) {
  const [mastery, setMastery] = useState(null);
  const [method, setMethod] = useState("✍️ 做题");
  const [notes, setNotes] = useState("");
  const [customItemName, setCustomItemName] = useState("");

  useEffect(() => {
    if(show) { setMastery(null); setMethod("✍️ 做题"); setNotes(""); setCustomItemName(""); }
  }, [show]);

  if (!show) return null;

  const handleSubmit = () => {
    if (!mastery) return alert("请选择掌握度！");
    onSubmit({ mastery, method, notes, customItemName, studyItemId: item?.id, studyItemName: item?.name });
  };

  return (
    <div className={`modal-overlay ${show ? "show" : ""}`}>
      <div className="modal">
        <h3>📝 復習完了！ ({initialMinutes}min)</h3>
        {item ? (
           <div style={{ fontSize: 14, color: "var(--accent)", fontWeight: 600, marginBottom: 16 }}>{item.subject} · {item.name}</div>
        ) : (
           <div className="modal-field">
             <label>复习内容 (未关联具体题目)</label>
             <input type="text" placeholder="例如: 2024 CS 过去问" value={customItemName} onChange={e => setCustomItemName(e.target.value)} />
           </div>
        )}
        <div className="modal-field">
          <label>掌握度 Mastery</label>
          <div className="modal-mastery-btns">
            {[ {v: "🟢", t: "掌握"}, {v: "🟡", t: "半熟"}, {v: "🔴", t: "不会"} ].map(m => (
              <button key={m.v} className={`mastery-btn ${mastery === m.v ? "selected" : ""}`} onClick={() => setMastery(m.v)}>
                <span className="emoji">{m.v}</span><span className="text">{m.t}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="modal-field">
          <label>方法 Method</label>
          <select value={method} onChange={e => setMethod(e.target.value)}>
            <option value="✍️ 做题">✍️ 做题</option>
            <option value="📖 通读">📖 通读</option>
            <option value="🧠 回忆">🧠 回忆</option>
            <option value="📝 笔记">📝 笔记</option>
          </select>
        </div>
        <div className="modal-field">
          <label>备注 Notes</label>
          <textarea placeholder="记录你的想法..." value={notes} onChange={e => setNotes(e.target.value)}></textarea>
        </div>
        <div className="modal-actions">
          <button className="cancel" onClick={onClose}>取消</button>
          <button className="submit" onClick={handleSubmit}>✓ 记录到 Notion</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════ MAIN DASHBOARD ═══════════════
function App() {
  const [data, setData] = useState({ summary: null, dueItems: [], logs: [], checkins: [] });
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState({ msg: "", type: "" });
  
  // Timer State
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerSecs, setTimerSecs] = useState(0);
  const [activeSubj, setActiveSubj] = useState("CS");
  const [activeItem, setActiveItem] = useState(null);
  const [completedIds, setCompletedIds] = useState(new Set());
  const timerStartRef = useRef(null);

  // Review Queue Filter
  const [queueFilter, setQueueFilter] = useState("all");

  // Modal State
  const [modalShow, setModalShow] = useState(false);
  const [modalMins, setModalMins] = useState(0);

  const showToast = (msg, type = "success") => setToast({ msg, type });

  const fetchData = useCallback(async () => {
    setLoading(true);
    try {
      await api("assign-daily"); // Auto assign first
      const allRes = await api("all");
      if (allRes && !allRes.error) {
        setData({ summary: allRes.summary, dueItems: allRes.dueItems, logs: allRes.logs || [], checkins: allRes.checkins || [] });
      }
    } catch (e) { console.error("Fetch Error:", e); }
    setLoading(false);
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  // Derived Stats mapping
  const stats = useMemo(() => {
    let totalMins = 0;
    const heat = {};
    const studyDates = new Set();
    
    data.logs.forEach(l => { totalMins += l.minutes || 0; if(l.minutes>0){ heat[l.date] = (heat[l.date]||0) + l.minutes; studyDates.add(l.date); } });
    data.checkins.forEach(c => { totalMins += c.minutes || 0; if(c.minutes>0){ heat[c.date] = (heat[c.date]||0) + c.minutes; studyDates.add(c.date); } });

    let streak = 0;
    const d = new Date();
    for(let i=0; i<365; i++) {
      const ds = d.toISOString().split("T")[0];
      if (studyDates.has(ds) || (i===0 && !studyDates.has(ds))) { // allow skip today if haven't studied yet
        if(studyDates.has(ds)) streak++;
      } else { break; }
      d.setDate(d.getDate() - 1);
    }

    return { totalHours: Math.round(totalMins / 60), streak, heatmap: heat, studiedTotal: data.summary?.totalReviewed || 0 };
  }, [data]);

  // Timer Logic
  useEffect(() => {
    let interval;
    if (timerRunning) interval = setInterval(() => setTimerSecs(s => s + 1), 1000);
    return () => clearInterval(interval);
  }, [timerRunning]);

  const toggleTimer = () => {
    if (!timerRunning) { setTimerRunning(true); timerStartRef.current = new Date().toISOString(); } 
    else {
      setTimerRunning(false);
      const mins = Math.max(1, Math.round(timerSecs / 60));
      if (mins >= 1) {
        setModalMins(mins);
        setModalShow(true); // Open modal to save
      } else {
        setTimerSecs(0); setActiveItem(null);
      }
    }
  };
  
  const resetTimer = () => { setTimerRunning(false); setTimerSecs(0); setActiveItem(null); };

  const handleModalSubmit = async (formData) => {
    setModalShow(false);
    showToast("记录中...", "");
    try {
      const isItem = !!activeItem;
      const title = isItem ? `${activeSubj} - ${activeItem.name}` : `${activeSubj} - ${formData.customItemName || "日常复习"}`;
      
      // 1. Create Log
      await api("create-log", {
        title, date: todayStr(), minutes: modalMins, method: formData.method,
        startTime: timerStartRef.current, endTime: new Date().toISOString()
      });

      // 2. Complete Review if bound to an item
      if (isItem) {
        await api("complete-review", { pageId: activeItem.id, mastery: formData.mastery });
        setCompletedIds(prev => new Set(prev).add(activeItem.id));
      }

      showToast(`✓ 已记录 ${modalMins}分钟！`, "success");
      setTimerSecs(0); setActiveItem(null);
      fetchData(); // Refresh background data
    } catch (e) { showToast("记录失败", "error"); }
  };

  if (loading) return (
    <div className="dashboard"><div className="loading-screen"><div className="loading-spinner"></div><div className="loading-text">Loading from Notion...</div></div></div>
  );

  return (
    <div className="dashboard">
      <Toast msg={toast.msg} type={toast.type} onClose={() => setToast({msg:""})} />
      <ReviewModal show={modalShow} item={activeItem} initialMinutes={modalMins} onClose={() => setModalShow(false)} onSubmit={handleModalSubmit} />

      {/* Header */}
      <div className="header">
        <div className="header-left">
          <h1>🎯 京大社情 Study Dashboard</h1>
          <p>社会情報学コース 2026.8 入試対策</p>
        </div>
        <div className="countdown-box">
          <div className="countdown-days">{daysLeft()}</div>
          <div className="countdown-label">Days Until Exam</div>
        </div>
      </div>

      {/* Stats Grid */}
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-icon" style={{background: timerRunning ? 'var(--red-light)' : 'var(--accent-light)'}}>🔥</div><div className="stat-value">{stats.streak}</div><div className="stat-label">連續学習日数</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background: "var(--blue-light)"}}>⏱</div><div className="stat-value">{stats.totalHours}</div><div className="stat-label">累計学習時間 (h)</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background: "var(--green-light)"}}>📚</div><div className="stat-value">{stats.studiedTotal}<span style={{fontSize:14, color:"var(--text-muted)"}}>/{data.summary?.totalItems||0}</span></div><div className="stat-label">学習済み項目</div></div>
        <div className="stat-card"><div className="stat-icon" style={{background: "var(--yellow-light)"}}>📋</div><div className="stat-value">{data.dueItems.length - completedIds.size}</div><div className="stat-label">今日待復習</div></div>
      </div>

      {/* Timer & Review Queue */}
      <div className="card timer-section">
        <div className="timer-layout">
          <div className="timer-panel">
            <div className="card-title" style={{marginBottom:12}}><span className="icon">⏱</span> STUDY TIMER</div>
            <div className="timer-subjects">
              {SUBJECTS.map(s => (
                <button key={s.id} className={`timer-subject-btn ${activeSubj === s.id ? "active" : ""}`} onClick={() => !timerRunning && setActiveSubj(s.id)}>{s.icon} {s.id}</button>
              ))}
            </div>
            <div className={`timer-display ${timerRunning ? "running" : ""}`}>{formatTime(timerSecs)}</div>
            <div className="timer-controls">
              <button className={`timer-btn ${timerRunning ? "stop" : "start"}`} onClick={toggleTimer}>{timerRunning ? "⏹ 停止" : "▶ 開始"}</button>
              <button className="timer-btn reset" onClick={resetTimer}>↻</button>
            </div>
            <div className={`timer-active-item ${!activeItem ? "empty" : ""}`}>
              <div className="label">{activeItem ? "正在复习" : "选择复习项目"}</div>
              <div className="item-name">{activeItem ? activeItem.name : "← 从右侧列表选择一题开始"}</div>
            </div>
          </div>
          <div className="review-queue-panel">
            <div className="review-queue-header">
              <div className="review-queue-title"><span className="icon">📋</span> 今日待復習 ({data.dueItems.length})</div>
              <div className="review-queue-filters">
                {["all", ...SUBJECTS.map(s=>s.id)].map(f => (
                  <button key={f} className={`review-filter-btn ${queueFilter === f ? "active" : ""}`} onClick={() => setQueueFilter(f)}>{f === "all" ? "全部" : f}</button>
                ))}
              </div>
            </div>
            <div className="review-queue-list">
              {data.dueItems.filter(i => queueFilter === "all" || i.subject === queueFilter).length === 0 ? (
                <div className="empty-state">🎉 今日の復習項目はありません！</div>
              ) : (
                data.dueItems.filter(i => queueFilter === "all" || i.subject === queueFilter).map(item => {
                  const isCompleted = completedIds.has(item.id);
                  const isSelected = activeItem?.id === item.id;
                  const prio = item.priority?.includes("S") ? "S" : item.priority?.includes("A") ? "A" : item.priority?.includes("B") ? "B" : "C";
                  return (
                    <div key={item.id} className={`review-queue-item ${isSelected ? "selected" : ""} ${isCompleted ? "completed" : ""}`} onClick={() => { if(!isCompleted && !timerRunning) { setActiveItem(item); setActiveSubj(item.subject); }}}>
                      <span className={`rq-subject ${item.subject}`}>{item.subject}</span>
                      <span className="rq-name" title={item.name}>{item.name}</span>
                      <span className={`rq-priority ${prio}`}>{prio}</span>
                      <span className="rq-mastery">{item.mastery || (item.isReview?"🔄":"🆕")}</span>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Heatmap */}
      <div className="card heatmap-section" style={{marginBottom: 24}}>
        <div className="card-header"><div className="card-title"><span className="icon">📊</span> 学習ヒートマップ</div><div className="card-badge">Recent Progress</div></div>
        <div className="heatmap-wrapper">
          <div className="heatmap-grid">
            <div className="heatmap-days-labels"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
            {Array.from({length: 26}).map((_, wIndex) => {
              const d = new Date(); d.setDate(d.getDate() - (26 - 1 - wIndex) * 7 - d.getDay() + 1); // rough back-calc
              return (
                <div key={wIndex} className="heatmap-week">
                  {Array.from({length: 7}).map((_, dIndex) => {
                    const currentD = new Date(d); currentD.setDate(currentD.getDate() + dIndex);
                    const ds = currentD.toISOString().split("T")[0];
                    const min = stats.heatmap[ds] || 0;
                    const level = min === 0 ? "" : min < 30 ? "l1" : min < 60 ? "l2" : min < 120 ? "l3" : "l4";
                    return <div key={dIndex} className={`heatmap-day ${level} ${ds === todayStr() ? "today" : ""}`} data-tip={min > 0 ? `${ds}: ${min}min` : null} style={{opacity: currentD > new Date() ? 0.3 : 1}}></div>;
                  })}
                </div>
              );
            })}
          </div>
          <div className="heatmap-legend">
            <span>Less</span><div className="heatmap-legend-box" style={{background: "var(--bg-warm)"}}></div><div className="heatmap-legend-box" style={{background: "#e0d5c3"}}></div><div className="heatmap-legend-box" style={{background: "#f5c882"}}></div><div className="heatmap-legend-box" style={{background: "#e8a44a"}}></div><div className="heatmap-legend-box" style={{background: "var(--accent)"}}></div><span>More</span>
          </div>
        </div>
      </div>

      <div className="main-grid">
        {/* Mastery Progress */}
        <div className="card">
          <div className="card-header"><div className="card-title"><span className="icon">📊</span> Mastery Progress</div></div>
          <div className="card-body">
            {SUBJECTS.map(s => {
              const d = data.summary?.bySubject?.[s.id] || { total:1, green:0, yellow:0, red:0, none:0 };
              const t = d.total || 1;
              return (
                <div key={s.id} className="mastery-subject">
                  <div className="mastery-label-row">
                    <span className="mastery-subject-name">{s.icon} {s.name}</span>
                    <span className="mastery-counts">🟢{d.green} 🟡{d.yellow} 🔴{d.red} ⚪{d.none}</span>
                  </div>
                  <div className="mastery-bar">
                    <div className="seg-green" style={{width: `${(d.green/t)*100}%`}}></div>
                    <div className="seg-yellow" style={{width: `${(d.yellow/t)*100}%`}}></div>
                    <div className="seg-red" style={{width: `${(d.red/t)*100}%`}}></div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Phase Progress */}
        <div className="card">
          <div className="card-header"><div className="card-title"><span className="icon">🎯</span> Phase Progress</div></div>
          <div className="card-body">
            <div className="phase-list">
              {PHASES.map((p, i) => {
                const s = new Date(p.start), e = new Date(p.end), cur = new Date();
                const total = (e-s)/864e5, el = Math.max(0, Math.min(total, (cur-s)/864e5));
                const pct = Math.round((el/total)*100);
                return (
                  <div key={p.id} className="phase-item">
                    <div className={`phase-num p${i+1}`}>{i+1}</div>
                    <div className="phase-info">
                      <div className="phase-name">{p.name}</div>
                      <div className="phase-meta">{cur > e ? "✅ Completed" : cur < s ? `${p.start.slice(5)} Start` : "In Progress"}</div>
                      <div className="phase-bar-bg"><div className="phase-bar-fill" style={{width: `${cur>e?100:pct}%`, background: p.color}}></div></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Weekly Plan */}
        <div className="card" style={{gridColumn: "1/-1"}}>
          <div className="card-header"><div className="card-title"><span className="icon">📅</span> 週間計画</div></div>
          <div className="card-body">
            <div className="week-grid">
              {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((dayName, i) => {
                const jsDay = i === 6 ? 0 : i + 1; // Map to JS getDay()
                const isToday = new Date().getDay() === jsDay;
                return (
                  <div key={dayName} className={`week-day ${isToday ? "today" : ""}`}>
                    <div className="week-day-label">{dayName}</div>
                    <div className="week-day-date">{jsDay===0?"日":jsDay===1?"月":jsDay===2?"火":jsDay===3?"水":jsDay===4?"木":jsDay===5?"金":"土"}</div>
                    <div className="week-day-tasks" dangerouslySetInnerHTML={{__html: WEEK_PLAN[jsDay].join("<br/>")}}></div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Recent Logs */}
        <div className="card" style={{gridColumn: "1/-1", marginTop: 0}}>
          <div className="card-header"><div className="card-title"><span className="icon">📝</span> 最近の復習記録</div></div>
          <div className="card-body">
            {data.logs.slice(0, 8).map((l, i) => (
              <div key={i} className="log-item">
                <span className="log-date">{l.date.slice(5)}</span>
                <span className="log-title">{l.title}</span>
                <span className="log-time">{l.minutes}min</span>
              </div>
            ))}
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京大社情 Study Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f4f0; font-family:'Noto Sans JP','Noto Sans SC',-apple-system,sans-serif; }
.due-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:#f8f8f5; margin-bottom:6px; border-left:3px solid #ccc; }
.due-info { flex:1; min-width:0; }
.due-info strong { display:block; font-size:13px; color:#333; }
.due-info small { font-size:11px; color:#999; }
.tag-new { font-size:10px; padding:1px 5px; border-radius:4px; background:#E3F2FD; color:#1565C0; margin-right:4px; }
.tag-review { font-size:10px; padding:1px 5px; border-radius:4px; background:#FFF3E0; color:#E65100; margin-right:4px; }
.mastery-btns { display:flex; gap:3px; flex-shrink:0; }
.mastery-btns button { background:none; border:1px solid #ddd; border-radius:6px; padding:3px 6px; font-size:14px; cursor:pointer; transition:transform .15s; }
.mastery-btns button:hover { transform:scale(1.15); }
.mastery-btns button:disabled { opacity:.4; cursor:not-allowed; }
.gcal-box { text-align:center; margin-top:8px; }
.gcal-btn { display:inline-block; padding:8px 18px; background:#1a73e8; color:#fff; border-radius:8px; font-size:12px; font-weight:600; text-decoration:none; }
.gcal-box small { display:block; font-size:10px; color:#aaa; margin-top:4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── 配置 ───
const API = "/api/notion";
const EXAM = new Date("2026-08-10");
const SUBJECTS = [
  { id:"CS", name:"CS 情報学基礎", color:"#D4A017", accent:"#FFF8E1", icon:"💻" },
  { id:"AI", name:"AI 人工知能",   color:"#3B7DD8", accent:"#E3F2FD", icon:"🤖" },
  { id:"HCI",name:"HCI 人机交互",  color:"#43A047", accent:"#E8F5E9", icon:"🖱️" },
  { id:"SE", name:"SE 软件工程",   color:"#D81B60", accent:"#FCE4EC", icon:"⚙️" },
  { id:"IR", name:"IR 情報検索",   color:"#E64A19", accent:"#FBE9E7", icon:"🔍" },
];
const PHASES = [
  { name:"Phase 1: 基础扫盲", start:"2026-02-19", end:"2026-04-15", desc:"通读教材+S级知识点", color:"#3B7DD8" },
  { name:"Phase 2: 过去问攻略", start:"2026-04-16", end:"2026-06-15", desc:"全部过去问至少做一遍", color:"#43A047" },
  { name:"Phase 3: 弱点强化", start:"2026-06-16", end:"2026-07-20", desc:"🔴🟡重做+模拟练习", color:"#E64A19" },
  { name:"Phase 4: 冲刺",     start:"2026-07-21", end:"2026-08-10", desc:"限时模拟+最终回顾", color:"#D81B60" },
];

const today = () => new Date().toISOString().split("T")[0];
const daysLeft = () => Math.ceil((EXAM - new Date()) / 864e5);
const curPhase = () => {
  const t = new Date(today());
  return PHASES.find(p => t >= new Date(p.start) && t <= new Date(p.end)) || PHASES[0];
};
const fmt = (s) => {
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h > 0
    ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

async function api(action, body) {
  const r = await fetch(`${API}?action=${action}`, {
    method: body ? "POST" : "GET",
    headers: body ? {"Content-Type":"application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

// ─── 小组件 ───
function Dots() {
  const [d, setD] = useState("");
  useEffect(() => { const i = setInterval(() => setD(v => v.length>=3?"":v+"."),400); return ()=>clearInterval(i); }, []);
  return <span style={{ fontFamily: "monospace" }}>{d||"."}</span>;
}
function Card({ title, children }) {
  return (
    <div style={{ background: "#fff", borderRadius: 16, padding: "20px 22px", border: "1px solid #e8e6e0" }}>
      <div style={{ fontSize: 12, color: "#999", letterSpacing: 1.5, fontFamily: "monospace", textTransform: "uppercase", marginBottom: 14 }}>{title}</div>
      {children}
    </div>
  );
}
function Stat({ label, value, sub }) {
  return (
    <div style={{ textAlign: "center", padding: "10px 6px", background: "#f8f8f5", borderRadius: 9 }}>
      <div style={{ fontSize: 10, color: "#999" }}>{label}</div>
      <div style={{ fontSize: 18, fontWeight: 700, color: "#1a1a2e" }}>{value}</div>
      <div style={{ fontSize: 9, color: "#aaa" }}>{sub}</div>
    </div>
  );
}

// ─── Countdown Banner ───
function Countdown({ phase, assignInfo }) {
  const d = daysLeft();
  const urg = d<=30?"#C62828":d<=90?"#E65100":"#1a1a2e";
  return (
    <div style={{ background: `linear-gradient(135deg,${urg},${urg}dd)`, borderRadius: 18, padding: "18px 24px", color: "#fff", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <div>
        <div style={{ fontSize: 11, opacity: .65, letterSpacing: 2, fontFamily: "monospace", textTransform: "uppercase" }}>京都大学 社会情報学 2026.8 入試</div>
        <div style={{ fontSize: 12, opacity: .45, marginTop: 4 }}>{phase?.name} — {phase?.desc}</div>
        {assignInfo && <div style={{ fontSize: 11, opacity: .7, marginTop: 4 }}>
          📅 今日({assignInfo.dayOfWeek}): {assignInfo.subjects?.join("+")} · 待学{assignInfo.totalForToday}题
          {assignInfo.newlyAssigned > 0 && " · 🆕新分配" + assignInfo.newlyAssigned + "题"}
        </div>}
      </div>
      <div style={{ textAlign: "right" }}>
        <div style={{ fontSize: 44, fontWeight: 800, fontFamily: "monospace", lineHeight: 1 }}>{d}</div>
        <div style={{ fontSize: 11, opacity: .6 }}>days left</div>
      </div>
    </div>
  );
}

// ─── Study Timer ───
function Timer({ onLog }) {
  const [run, setRun] = useState(false);
  const [sec, setSec] = useState(0);
  const [subj, setSubj] = useState("CS");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [result, setResult] = useState(null);
  const start0 = useRef(null);

  useEffect(() => { if(!run) return; const i=setInterval(()=>setSec(s=>s+1),1000); return ()=>clearInterval(i); }, [run]);

  const go = () => { setRun(true); start0.current=new Date(); setSec(0); setResult(null); };
  const stop = async () => {
    setRun(false);
    const mins = Math.max(1, Math.round(sec/60));
    setSaving(true); setResult(null);
    try {
      const r = await api("create-log", {
        title:`${subj} 复习 ${today()} - ${note||"日常复习"}`,
        date:today(), minutes:mins, method:"✍️ 做题",
        startTime:start0.current?.toISOString(), endTime:new Date().toISOString(),
      });
      setResult({ ok:r.success, minutes:mins });
      if(r.success) onLog?.({ subject:subj, minutes:mins, date:today(), note });
    } catch { setResult({ ok:false }); }
    setSaving(false); setNote("");
  };

  const sub = SUBJECTS.find(s=>s.id===subj);
  const pct = Math.min((sec/(45*60))*100, 100);

  return (
    <div style={{ background: "linear-gradient(135deg,#13111a 0%,#1a1833 50%,#0d1b3e 100%)", borderRadius: 18, padding: "24px 26px", color: "#fff", position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: "#222" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: sub?.color, transition: "width 1s linear", borderRadius: "18px 0 0 0" }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 11, color: "#6b7094", letterSpacing: 2, fontFamily: "monospace", textTransform: "uppercase" }}>⏱ Study Timer</span>
        <span style={{ fontSize: 11, color: "#4a5072", background: "rgba(255,255,255,.04)", borderRadius: 8, padding: "3px 10px" }}>目标 45min</span>
      </div>
      <div style={{ fontSize: 56, fontFamily: "monospace", fontWeight: 200, textAlign: "center", letterSpacing: 6, color: run?"#e6f1ff":"#4a5072", textShadow: run?`0 0 60px ${sub?.color}30`:"none", margin: "4px 0 18px", transition: "all .3s" }}>{fmt(sec)}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {SUBJECTS.map(s=>(
          <button key={s.id} onClick={()=>!run&&setSubj(s.id)} style={{ background: subj===s.id?s.color:"rgba(255,255,255,.05)", color: subj===s.id?"#fff":"#6b7094", border: "none", borderRadius: 7, padding: "5px 12px", fontSize: 12, cursor: run?"not-allowed":"pointer", opacity: run&&subj!==s.id?.25:1, fontWeight: subj===s.id?600:400, transition: "all .2s" }}>{s.icon} {s.id}</button>
        ))}
      </div>
      {!run && <input type="text" placeholder="复习内容 (如: 2024.8 CS Q1)" value={note} onChange={e=>setNote(e.target.value)} style={{ width: "100%", background: "rgba(255,255,255,.05)", border: "1px solid rgba(255,255,255,.08)", borderRadius: 9, padding: "9px 13px", color: "#ccd6f6", fontSize: 12, marginBottom: 12, outline: "none", boxSizing: "border-box" }} />}
      <div style={{ display: "flex", gap: 8 }}>
        {!run ? (
          <button onClick={go} style={{ flex: 1, background: sub?.color, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 15, fontWeight: 600, cursor: "pointer", letterSpacing: 1 }}>▶ 开始复习</button>
        ) : (
          <button onClick={stop} disabled={saving} style={{ flex: 1, background: saving?"#555":"#C62828", color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontSize: 15, fontWeight: 600, cursor: "pointer" }}>{saving?"⏳ 记录到Notion中...":"⏹ 结束 → 记录到Notion"}</button>
        )}
      </div>
      {result && (
        <div style={{ marginTop: 10, padding: "8px 14px", borderRadius: 8, fontSize: 12, textAlign: "center", background: result.ok?"rgba(67,160,71,.15)":"rgba(198,40,40,.15)", color: result.ok?"#81C784":"#EF9A9A" }}>
          {result.ok ? `✅ 已记录! (${result.minutes}分钟)` : "⚠️ 记录失败"}
        </div>
      )}
    </div>
  );
}

// ─── Progress Overview ───
function Progress({ data, loading }) {
  if(loading) return <Card title="📊 Mastery Progress"><div style={{ textAlign: "center", padding: 30, color: "#999" }}>加载中<Dots /></div></Card>;
  if(!data) return <Card title="📊 Mastery Progress"><div style={{ textAlign: "center", padding: 30, color: "#bbb" }}>点击 🔄 加载数据</div></Card>;
  const subjects = data.bySubject || {};
  return (
    <Card title="📊 Mastery Progress">
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {SUBJECTS.map(s => {
          const d = subjects[s.id] || { total:0,green:0,yellow:0,red:0,none:0 };
          const t = d.total||1;
          return (
            <div key={s.id}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#333" }}>{s.icon} {s.id}</span>
                <span style={{ fontSize: 11, color: "#999", fontFamily: "monospace" }}>🟢{d.green} 🟡{d.yellow} 🔴{d.red} ⬜{d.none}</span>
              </div>
              <div style={{ height: 8, background: "#f0f0f0", borderRadius: 4, display: "flex", overflow: "hidden" }}>
                <div style={{ width: `${(d.green/t)*100}%`, background: "#66BB6A", transition: "width .5s" }} />
                <div style={{ width: `${(d.yellow/t)*100}%`, background: "#FFA726", transition: "width .5s" }} />
                <div style={{ width: `${(d.red/t)*100}%`, background: "#EF5350", transition: "width .5s" }} />
              </div>
            </div>
          );
        })}
      </div>
      {data.totalItems && (
        <div style={{ marginTop: 14, padding: "10px 14px", background: "#f8f8f5", borderRadius: 10, fontSize: 12, color: "#666", textAlign: "center" }}>
          共 <b>{data.totalItems}</b> 个学习项目 · 🟢 掌握 <b>{data.totalGreen||0}</b> · 完成率 <b>{data.totalItems ? Math.round(((data.totalGreen||0)/data.totalItems)*100) : 0}%</b>
        </div>
      )}
    </Card>
  );
}

// ─── Today's Due Items (v2: 新学/复习 + 完成按钮) ───
function TodayDue({ items, loading, onComplete }) {
  const [busy, setBusy] = useState(null);
  if(loading) return <Card title="📋 今日学习计划"><div style={{ textAlign: "center", padding: 30, color: "#999" }}>加载中<Dots /></div></Card>;
  const list = items || [];
  const doComplete = async (id, m) => {
    setBusy(id);
    await onComplete?.(id, m);
    setBusy(null);
  };
  return (
    <Card title={`📋 今日学习计划 (${list.length})`}>
      {list.length === 0 ? (
        <div style={{ textAlign: "center", padding: 20, color: "#bbb", fontSize: 13 }}>{items ? "✅ 今日计划已完成！" : "点击 🔄 加载数据"}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 320, overflowY: "auto" }}>
          {list.map((item,i) => {
            const sub = SUBJECTS.find(s=>s.id===item.subject);
            const isNew = !item.isReview;
            const isBusy = busy === item.id;
            return (
              <div key={item.id||i} className="due-row" style={{ borderLeftColor: sub?.color||"#ccc" }}>
                <span style={{ fontSize: 13 }}>{sub?.icon||"📖"}</span>
                <div className="due-info">
                  <div>
                    <span className={isNew ? "tag-new" : "tag-review"}>{isNew ? "🆕新学" : "🔁复习"}</span>
                    <strong>{item.name}</strong>
                  </div>
                  <small>{item.type} · {item.priority||""}</small>
                </div>
                <div className="mastery-btns">
                  {["🔴","🟡","🟢"].map(m => (
                    <button key={m} onClick={()=>doComplete(item.id,m)} disabled={isBusy}
                      title={m==="🔴"?"不会(明天再来)":m==="🟡"?"半熟(3天后)":"掌握(完成!)"}>{m}</button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

// ─── Google Calendar Button ───
function GCalButton() {
  const url = API + "?action=daily-ics";
  const subUrl = window.location.origin + "/api/notion?action=daily-ics";
  return (
    <div className="gcal-box">
      <a href={url} download="study-plan.ics" className="gcal-btn">📅 下载今日日程 (.ics)</a>
      <small>Google Calendar 订阅: {subUrl}</small>
    </div>
  );
}

// ─── Calendar Heatmap ───
function Calendar({ logData }) {
  const now = new Date();
  const [mo, setMo] = useState(now.getMonth());
  const [yr, setYr] = useState(now.getFullYear());
  const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const wk = ["日","月","火","水","木","金","土"];

  const first = new Date(yr,mo,1), last = new Date(yr,mo+1,0);
  const cells = [];
  for(let i=0;i<first.getDay();i++) cells.push(null);
  for(let d=1;d<=last.getDate();d++) cells.push(d);

  const byDate = {};
  (logData||[]).forEach(l => {
    if(!byDate[l.date]) byDate[l.date]={count:0,minutes:0};
    byDate[l.date].count++; byDate[l.date].minutes+=(l.minutes||0);
  });

  const prev = () => { if(mo===0){setMo(11);setYr(y=>y-1);} else setMo(m=>m-1); };
  const next = () => { if(mo===11){setMo(0);setYr(y=>y+1);} else setMo(m=>m+1); };

  let streak=0; const dd=new Date(now);
  for(let i=0;i<365;i++){ if(byDate[dd.toISOString().split("T")[0]]) streak++; else break; dd.setDate(dd.getDate()-1); }

  const moMin = Object.entries(byDate).filter(([k])=>k.startsWith(`${yr}-${String(mo+1).padStart(2,"0")}`)).reduce((s,[,v])=>s+v.minutes,0);
  const todayStr = today();
  const todayMin = byDate[todayStr]?.minutes||0;

  return (
    <Card title="📆 Study Calendar">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <button onClick={prev} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#999", padding: "4px 8px" }}>◂</button>
        <span style={{ fontSize: 14, fontWeight: 600 }}>{yr}年{months[mo]}</span>
        <button onClick={next} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#999", padding: "4px 8px" }}>▸</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, textAlign: "center" }}>
        {wk.map(w=><div key={w} style={{ fontSize: 10, color: "#bbb", padding: 3 }}>{w}</div>)}
        {cells.map((day,i) => {
          if(day===null) return <div key={`e${i}`}/>;
          const ds=`${yr}-${String(mo+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const info=byDate[ds]; const isT=ds===todayStr;
          const intensity=info?Math.min(info.minutes/60,1):0;
          const bg=info?`rgba(67,160,71,${0.15+intensity*0.65})`:isT?"#1a1a2e":"transparent";
          return (
            <div key={i} title={info?`${info.minutes}min · ${info.count}次`:""} style={{ padding: "5px 0", borderRadius: 6, fontSize: 12, background: bg, color: isT?"#fff":info?"#1B5E20":"#888", fontWeight: isT?700:400, cursor: info?"help":"default" }}>
              {day}
              {info && <div style={{ fontSize: 7, marginTop: 1, opacity: .8 }}>{info.minutes}m</div>}
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
        <Stat label="今日" value={`${todayMin}m`} sub={todayMin>=45?"✅达标":`差${Math.max(0,45-todayMin)}m`} />
        <Stat label="本月" value={`${Math.round(moMin/60)}h`} sub={`${moMin}min`} />
        <Stat label="连续" value={`${streak}天`} sub={streak>=7?"🔥 Great!":streak>=3?"👍 加油":"💪 开始"} />
      </div>
    </Card>
  );
}

// ─── Phase Progress ───
function PhaseBar({ logData, studyData }) {
  const t = new Date(today()), phase = curPhase();
  const studyDays = new Set((logData||[]).map(l=>l.date)).size;
  const reviewed = studyData?.totalReviewed || 0;
  const totalItems = studyData?.totalItems || 0;
  return (
    <Card title="🎯 Phase Progress">
      {PHASES.map((p,i) => {
        const s=new Date(p.start),e=new Date(p.end);
        const total=(e-s)/864e5, el=Math.max(0,Math.min(total,(t-s)/864e5));
        const pct=Math.round((el/total)*100);
        const cur=p===phase, past=t>e, future=t<s;
        return (
          <div key={i} style={{ marginBottom: 12, padding: cur?"10px 12px":"6px 12px", background: cur?`${p.color}08`:"transparent", borderRadius: 9, border: cur?`1px solid ${p.color}25`:"1px solid transparent", opacity: future?.35:1 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ fontSize: 12, fontWeight: cur?700:400, color: cur?p.color:"#666" }}>{cur&&"▸ "}{p.name}</span>
              <span style={{ fontSize: 10, color: "#aaa", fontFamily: "monospace" }}>{past?"✅":future?`${p.start.slice(5)}~`:`${pct}%`}</span>
            </div>
            {cur && <div style={{ fontSize: 11, color: "#888", marginBottom: 6 }}>{p.desc}</div>}
            <div style={{ height: 3, background: "#eee", borderRadius: 2 }}>
              <div style={{ height: "100%", width: `${past?100:pct}%`, background: past?"#ccc":p.color, borderRadius: 2 }} />
            </div>
          </div>
        );
      })}
      <div style={{ fontSize: 11, color: "#999", textAlign: "center", marginTop: 6 }}>📅 累计学习 <b>{studyDays}</b> 天 · 已复习 <b>{reviewed}</b>/{totalItems} 项</div>
    </Card>
  );
}

// ─── Weekly Plan ───
function WeeklyPlan() {
  const dayMap = {0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const todayKey = dayMap[new Date().getDay()];
  const plan = [
    {day:"Mon",sub:"CS",focus:"Ch1-4 基础",min:45},
    {day:"Tue",sub:"AI",focus:"过去问+知识点",min:45},
    {day:"Wed",sub:"HCI",focus:"实验设计/应用",min:45},
    {day:"Thu",sub:"SE",focus:"章节重点",min:45},
    {day:"Fri",sub:"CS",focus:"Ch5-8 算法",min:45},
    {day:"Sat",sub:"IR",focus:"过去问集中",min:120},
    {day:"Sun",sub:"CS",focus:"总复习+弱点",min:120},
  ];
  return (
    <Card title="📋 Weekly Plan">
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {plan.map(p => {
          const sub=SUBJECTS.find(s=>s.id===p.sub);
          const cur=p.day===todayKey;
          return (
            <div key={p.day} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 10px", borderRadius: 8, background: cur?`${sub?.color}0d`:"transparent", border: cur?`1.5px solid ${sub?.color}30`:"1.5px solid transparent" }}>
              <span style={{ width: 32, fontSize: 11, fontWeight: cur?800:400, color: cur?sub?.color:"#aaa", fontFamily: "monospace" }}>{p.day}</span>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: sub?.color, opacity: cur?1:.3, flexShrink: 0 }} />
              <span style={{ flex: 1, fontSize: 12, fontWeight: cur?600:400, color: cur?"#333":"#888" }}>{sub?.icon} {p.sub} <span style={{ color: "#bbb", fontWeight: 400, marginLeft: 4 }}>{p.focus}</span></span>
              <span style={{ fontSize: 10, color: "#bbb", fontFamily: "monospace" }}>{p.min}m</span>
            </div>
          );
        })}
      </div>
    </Card>
  );
}

// ─── Recent Activity ───
function RecentAct({ logData }) {
  const recent = (logData||[]).slice(-10).reverse();
  return (
    <Card title="📝 最近复习记录">
      {recent.length===0 ? (
        <div style={{ textAlign: "center", padding: 20, color: "#bbb", fontSize: 13 }}>暂无记录</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 5, maxHeight: 240, overflowY: "auto" }}>
          {recent.map((r,i) => {
            const sub=SUBJECTS.find(s=>s.id===r.subject);
            return (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderRadius: 7, background: "#fafaf7" }}>
                <div style={{ width: 5, height: 5, borderRadius: "50%", background: sub?.color||"#ccc", flexShrink: 0 }} />
                <div style={{ flex: 1, fontSize: 12, color: "#555", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sub?.icon||"📖"} {r.title||r.subject}</div>
                <span style={{ fontSize: 11, color: "#aaa", fontFamily: "monospace", flexShrink: 0 }}>{r.minutes||"?"}m</span>
                <span style={{ fontSize: 10, color: "#ccc", flexShrink: 0 }}>{(r.date||"").slice(5)}</span>
              </div>
            );
          })}
        </div>
      )}
    </Card>
  );
}

// ─── Motivational Quote ───
function Motiv({ logData }) {
  const totalH = Math.round((logData||[]).reduce((s,l)=>s+(l.minutes||0),0)/60);
  const quotes = ["一日一歩、千里の道も","继続は力なり","今日の一問が、合格への一歩","努力は裏切らない","京大で待ってるよ"];
  const q = quotes[new Date().getDate()%quotes.length];
  return (
    <div style={{ background: "linear-gradient(135deg,#fdfcfb,#e8ddd0)", borderRadius: 16, padding: "16px 22px", border: "1px solid #e0d5c9", textAlign: "center" }}>
      <div style={{ fontSize: 16, fontWeight: 300, color: "#5D4E37", fontStyle: "italic", letterSpacing: 1 }}>「{q}」</div>
      <div style={{ fontSize: 11, color: "#A08B6F", marginTop: 8 }}>累计学习 <b>{totalH}</b> 小时 · 距考试 <b>{daysLeft()}</b> 天</div>
    </div>
  );
}

// ─── Workflow Tip ───
function Tip() {
  return (
    <Card title="💡 How It Works">
      <div style={{ fontSize: 12, color: "#666", lineHeight: 2 }}>
        <div>1️⃣ <b>打开 Dashboard</b> → 自动排题 (assign-daily)</div>
        <div>2️⃣ <b>学完一题</b> → 点 🔴🟡🟢 → 自动更新 Mastery + Redo Date</div>
        <div>3️⃣ <b>用计时器</b> → 计时 → 自动记录到 Notion 復習ログ</div>
        <div>4️⃣ <b>记忆曲线</b> → 🔴明天 / 🟡3天后 / 🟢完成不再推送</div>
        <div>5️⃣ <b>点 🔄</b> 手动刷新 · 📅 可订阅 Google Calendar</div>
      </div>
    </Card>
  );
}

// ═══════════════ MAIN DASHBOARD ═══════════════
function App() {
  const [studyData, setStudyData] = useState(null);
  const [dueItems, setDueItems] = useState(null);
  const [logData, setLogData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [assignInfo, setAssignInfo] = useState(null);

  const fetchData = useCallback(async () => {
    setLoading(true);
    try {
      // Step 1: 自动排题
      const assignRes = await api("assign-daily");
      setAssignInfo(assignRes);
      // Step 2: 加载全部数据
      const allRes = await api("all");
      if (allRes && !allRes.error) {
        setStudyData(allRes.summary);
        setDueItems(allRes.dueItems);
        setLogData(allRes.logs || []);
      }
    } catch (e) {
      console.error("fetchData:", e);
      // Fallback: 分别调用
      try {
        const [r1,r2,r3] = await Promise.all([api("study-summary"),api("due-today"),api("recent-logs")]);
        if(r1&&!r1.error) setStudyData(r1);
        if(r2?.items) setDueItems(r2.items);
        if(r3?.logs) setLogData(r3.logs);
      } catch(e2) { console.error("fallback fail:",e2); }
    }
    setLastSync(new Date().toLocaleTimeString("ja-JP"));
    setLoading(false);
  }, []);

  // 完成复习回调
  const handleComplete = async (pageId, mastery) => {
    try {
      const r = await api("complete-review", { pageId, mastery });
      if (r.success) {
        setDueItems(prev => (prev||[]).filter(i => i.id !== pageId));
      }
    } catch(e) { console.error("complete fail:",e); }
  };

  useEffect(() => { fetchData(); }, [fetchData]);

  const handleLog = (entry) => {
    setLogData(prev => [...prev, { title:`${entry.subject} - ${entry.note}`, date:entry.date, minutes:entry.minutes, subject:entry.subject }]);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#f5f4f0", fontFamily: "'Noto Sans JP','Noto Sans SC',-apple-system,sans-serif" }}>
      <div style={{ maxWidth: 920, margin: "0 auto", padding: "20px 16px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: "#aaa" }}>{lastSync ? `最后同步: ${lastSync}` : "加载中..."}</div>
          <button onClick={fetchData} disabled={loading} style={{ background: loading?"#eee":"#1a1a2e", color: loading?"#999":"#fff", border: "none", borderRadius: 8, padding: "7px 16px", fontSize: 12, cursor: loading?"not-allowed":"pointer", fontWeight: 500 }}>
            {loading ? "⏳ 同步中..." : "🔄 从 Notion 同步数据"}
          </button>
        </div>

        <Countdown phase={curPhase()} assignInfo={assignInfo} />
        <div style={{ marginTop: 14 }}><Motiv logData={logData} /></div>

        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 14, marginTop: 14 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Timer onLog={handleLog} />
            <TodayDue items={dueItems} loading={loading} onComplete={handleComplete} />
            <GCalButton />
            <Tip />
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Progress data={studyData} loading={loading} />
            <Calendar logData={logData} />
            <WeeklyPlan />
            <PhaseBar logData={logData} studyData={studyData} />
            <RecentAct logData={logData} />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

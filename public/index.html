<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>京大社情 Study Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f5f0; --bg-card: #ffffff; --bg-card-alt: #fefcf9;
  --bg-warm: #f3ede4; --bg-hover: #ede7dc;
  --border: #e6ddd1; --border-light: #efe8dc;
  --text: #2c2925; --text-secondary: #767066; --text-muted: #a49b8e;
  --accent: #d97036; --accent-light: #fdf0e5; --accent-hover: #c4622b;
  --green: #3d9e6e; --green-light: #e6f4ec;
  --yellow: #e5a821; --yellow-light: #fef7e0;
  --red: #d9534f; --red-light: #fdecea;
  --blue: #4a80e0; --blue-light: #e7effc;
  --purple: #8b6cc1; --purple-light: #f0ebf7;
  --shadow-xs: 0 1px 2px rgba(44,41,37,0.04);
  --shadow-sm: 0 1px 4px rgba(44,41,37,0.06), 0 1px 2px rgba(44,41,37,0.04);
  --shadow-md: 0 4px 16px rgba(44,41,37,0.08);
  --shadow-lg: 0 8px 32px rgba(44,41,37,0.12);
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
  --font: 'DM Sans', 'Noto Sans JP', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { cursor: pointer; border: none; background: none; font-family: var(--font); }

.header { position: sticky; top: 0; z-index: 100; background: var(--bg-card); border-bottom: 1px solid var(--border-light); box-shadow: var(--shadow-xs); }
.header-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 6px; }
.header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.countdown-pill { display: flex; align-items: baseline; gap: 4px; background: var(--accent-light); padding: 3px 10px; border-radius: 20px; }
.countdown-pill .days { font-family: var(--mono); font-weight: 700; color: var(--accent); font-size: 15px; }
.countdown-pill span:last-child { font-size: 9px; font-weight: 600; color: var(--accent); text-transform: uppercase; }
.tab-bar { display: flex; position: relative; padding: 6px 16px 0; gap: 0; overflow-x: auto; }
.tab-btn { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--text-muted); transition: color 0.15s; display: flex; align-items: center; gap: 4px; white-space: nowrap; position: relative; z-index: 1; }
.tab-btn.active { color: var(--accent); }
.tab-icon { font-size: 14px; }
.tab-indicator { position: absolute; bottom: 0; height: 2.5px; background: var(--accent); border-radius: 2px 2px 0 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
.page { display: none; padding: 14px 16px 100px; max-width: 640px; margin: 0 auto; }
.page.active { display: block; }
.card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); margin-bottom: 14px; overflow: hidden; }
.card-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; }
.card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.card-title .icon { font-size: 15px; }
.card-badge { font-size: 10px; font-weight: 600; color: var(--text-muted); background: var(--bg-warm); padding: 2px 10px; border-radius: 10px; }
.card-body { padding: 0 16px 14px; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 12px 6px; text-align: center; border: 1px solid var(--border-light); box-shadow: var(--shadow-xs); }
.stat-emoji { font-size: 20px; margin-bottom: 2px; }
.stat-value { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.stat-value .unit { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.stat-label { font-size: 9px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px; }

/* Mastery */
.mastery-row { margin-bottom: 12px; } .mastery-row:last-child { margin-bottom: 0; }
.mastery-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.mastery-name { font-size: 13px; font-weight: 600; } .mastery-counts { font-size: 10px; color: var(--text-muted); font-weight: 500; }
.mastery-bar { height: 8px; border-radius: 4px; background: var(--bg-warm); overflow: hidden; display: flex; }
.mastery-bar .g { background: var(--green); transition: width 0.6s ease; }
.mastery-bar .y { background: var(--yellow); transition: width 0.6s ease; }
.mastery-bar .r { background: var(--red); transition: width 0.6s ease; }

/* Heatmap */
.heatmap-scroll { overflow-x: auto; padding-bottom: 4px; }
.heatmap-grid { display: flex; gap: 3px; min-width: fit-content; }
.heatmap-days { display: flex; flex-direction: column; gap: 3px; padding-right: 4px; }
.heatmap-days span { width: 10px; height: 10px; font-size: 7px; color: var(--text-muted); display: flex; align-items: center; }
.heatmap-week { display: flex; flex-direction: column; gap: 3px; }
.hm { width: 10px; height: 10px; background: var(--bg-warm); border-radius: 2px; }
.hm.l1 { background: #e2d7c6; } .hm.l2 { background: #f0c06e; } .hm.l3 { background: #e29840; } .hm.l4 { background: var(--accent); }
.hm.today { outline: 1.5px solid var(--accent); outline-offset: 1px; } .hm.future { opacity: 0.25; }
.heatmap-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; margin-top: 6px; font-size: 9px; color: var(--text-muted); }
.heatmap-legend .box { width: 10px; height: 10px; border-radius: 2px; }

/* Timer */
.timer-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); padding: 20px; text-align: center; margin-bottom: 14px; }
.timer-display { font-family: var(--mono); font-size: 48px; font-weight: 700; color: var(--text); letter-spacing: 2px; line-height: 1; margin: 8px 0 14px; transition: color 0.3s; }
.timer-display.running { color: var(--accent); }
.timer-controls { display: flex; gap: 10px; justify-content: center; }
.tbtn { padding: 10px 28px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: all 0.15s; }
.tbtn.start { background: var(--green); color: #fff; } .tbtn.start:hover { background: #358c60; }
.tbtn.stop { background: var(--red); color: #fff; } .tbtn.stop:hover { background: #c4443f; }
.tbtn.reset { background: var(--bg-warm); color: var(--text-secondary); } .tbtn.reset:hover { background: var(--bg-hover); }
.timer-active { margin-top: 14px; padding: 10px 14px; background: var(--accent-light); border-radius: var(--radius-sm); border: 1px solid #f0dcc8; display: flex; align-items: center; gap: 10px; }
.timer-active .lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.timer-active .name { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.timer-active .notion-link { flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1.5px solid var(--accent); border-radius: 8px; }
.timer-active .notion-link:hover { background: var(--accent); color: #fff; }
.timer-active.empty { background: var(--bg-warm); border-color: var(--border); }
.timer-active.empty .lbl { color: var(--text-muted); }
.timer-active.empty .name { color: var(--text-secondary); font-weight: 400; font-size: 12px; }

/* Queue items */
.queue-section { font-size: 11px; font-weight: 700; color: var(--text-muted); padding: 10px 16px 4px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-light); background: var(--bg-card-alt); }
.queue-list { max-height: 55vh; overflow-y: auto; }
.qi { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border-light); transition: all 0.15s; cursor: pointer; }
.qi:last-child { border-bottom: none; }
.qi:hover { background: var(--bg-warm); }
.qi.selected { background: var(--accent-light); }
.qi.completed { opacity: 0.4; }
.qi-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px; }
.qi.completed .qi-check { background: var(--green); border-color: var(--green); color: #fff; }
.qi-type-badge { font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.3px; }
.qi-type-badge.review, .qi-type-badge.review-term { background: var(--yellow-light); color: #b8860b; }
.qi-type-badge.new { background: var(--blue-light); color: var(--blue); }
.qi-type-badge.term { background: var(--purple-light); color: var(--purple); }
.qi-type-badge.reading { background: var(--green-light); color: var(--green); }
.qi-sub { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; text-transform: uppercase; }
.qi-sub.CS { background: #fef3e2; color: #b8700f; } .qi-sub.AI { background: #e6f4ec; color: #2d8055; }
.qi-sub.HCI { background: #fdecea; color: #b83b36; } .qi-sub.SE { background: #f0ebf7; color: #6b4fa0; }
.qi-sub.IR { background: #e7effc; color: #3567b8; }
.qi-name { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qi-pri { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
.qi-pri.S, .qi-pri.Critical { background: var(--red-light); color: var(--red); }
.qi-pri.A, .qi-pri.High { background: #fff3e0; color: #c75600; }
.qi-pri.B, .qi-pri.Medium { background: var(--yellow-light); color: #b8860b; }
.qi-pri.C, .qi-pri.Low { background: var(--green-light); color: var(--green); }
.qi-mastery { font-size: 13px; flex-shrink: 0; }
.qi-notion { font-size: 12px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; text-decoration: none; padding: 2px 6px; border-radius: 4px; }
.qi:hover .qi-notion { opacity: 1; }
.qi-done-btn { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; background: var(--green); color: #fff; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.qi:hover .qi-done-btn { opacity: 1; }
.qi.completed .qi-done-btn, .qi.completed .qi-notion { display: none; }

/* Sub-tabs for free selection */
.sub-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-light); background: var(--bg-card); }
.sub-tab { flex: 1; padding: 10px 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 2.5px solid transparent; transition: all 0.15s; }
.sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.sub-tab:hover { color: var(--text-secondary); }

/* Collapsible year/lec groups */
.group-header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg-card-alt); border-bottom: 1px solid var(--border-light); cursor: pointer; user-select: none; }
.group-header:hover { background: var(--bg-warm); }
.group-arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
.group-arrow.open { transform: rotate(90deg); }
.group-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); flex: 1; }
.group-count { font-size: 10px; color: var(--text-muted); font-weight: 600; }
.group-items { display: none; }
.group-items.open { display: block; }

/* Flashcard */
.flashcard-container { padding: 16px; }
.flashcard { background: var(--bg-card); border: 2px solid var(--border-light); border-radius: var(--radius); min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; }
.flashcard:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.flashcard .fc-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.flashcard .fc-term { font-size: 22px; font-weight: 700; color: var(--text); }
.flashcard .fc-definition { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-top: 12px; display: none; }
.flashcard.flipped .fc-definition { display: block; }
.flashcard.flipped .fc-label { color: var(--accent); }
.fc-meta { font-size: 10px; color: var(--text-muted); margin-top: 8px; }
.fc-nav { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.fc-nav button { padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.fc-nav .fc-prev, .fc-nav .fc-next { background: var(--bg-warm); color: var(--text-secondary); }
.fc-mastery-btns { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }
.fc-mbtn { padding: 8px 16px; border: 2px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 600; transition: all 0.15s; }
.fc-mbtn:hover { border-color: var(--accent); }
.fc-mbtn.g { border-color: var(--green); color: var(--green); } .fc-mbtn.g:hover { background: var(--green-light); }
.fc-mbtn.y { border-color: var(--yellow); color: #b8860b; } .fc-mbtn.y:hover { background: var(--yellow-light); }
.fc-mbtn.r { border-color: var(--red); color: var(--red); } .fc-mbtn.r:hover { background: var(--red-light); }
.fc-progress { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px; }
.fc-lec-select { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
.fc-lec-btn { padding: 5px 14px; border: 2px solid var(--border); border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.fc-lec-btn.active { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
.mode-toggle { display: flex; gap: 0; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.mode-toggle button { flex: 1; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--text-secondary); background: var(--bg-card); transition: all 0.15s; }
.mode-toggle button.active { background: var(--purple); color: #fff; }

/* Reading items */
.book-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: all 0.15s; }
.book-item:hover { background: var(--bg-warm); }
.book-item.active { background: var(--accent-light); }
.book-icon { font-size: 24px; }
.book-info { flex: 1; }
.book-name { font-size: 14px; font-weight: 600; }
.book-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Phase / Log / Modal / Toast */
.phase-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.phase-item:last-child { border-bottom: none; }
.phase-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.phase-dot.p0 { background: #9e9e9e; } .phase-dot.p1 { background: var(--blue); } .phase-dot.p2 { background: var(--accent); } .phase-dot.p3 { background: var(--red); } .phase-dot.p4 { background: var(--purple); }
.phase-info { flex: 1; min-width: 0; } .phase-name { font-size: 12px; font-weight: 600; } .phase-meta { font-size: 10px; color: var(--text-muted); }
.phase-bar { height: 5px; background: var(--bg-warm); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.phase-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.log-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border-light); }
.log-item:last-child { border-bottom: none; }
.log-date { font-family: var(--mono); font-size: 10px; color: var(--text-muted); flex-shrink: 0; width: 66px; }
.log-title { flex: 1; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.log-time { font-size: 11px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }

.modal-overlay { position: fixed; inset: 0; background: rgba(44,41,37,0.4); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal { background: var(--bg-card); border-radius: 20px 20px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 640px; box-shadow: var(--shadow-lg); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
.modal-overlay.show .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.modal-item-name { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 16px; padding: 8px 12px; background: var(--accent-light); border-radius: var(--radius-xs); }
.modal-field { margin-bottom: 14px; }
.modal-field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.modal-mastery-btns { display: flex; gap: 8px; }
.mbtn { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); text-align: center; transition: all 0.15s; }
.mbtn:hover { border-color: var(--accent); } .mbtn.selected { border-color: var(--accent); background: var(--accent-light); }
.mbtn .emoji { font-size: 22px; display: block; margin-bottom: 2px; } .mbtn .text { font-size: 10px; color: var(--text-secondary); font-weight: 700; }
.modal-field select, .modal-field textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: var(--font); font-size: 13px; background: var(--bg-card); color: var(--text); }
.modal-field textarea { resize: vertical; min-height: 50px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }
.modal-actions .cancel { background: var(--bg-warm); color: var(--text-secondary); }
.modal-actions .submit { background: var(--accent); color: #fff; } .modal-actions .submit:hover { background: var(--accent-hover); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); padding: 10px 20px; background: var(--text); color: #fff; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 2000; opacity: 0; transition: all 0.3s; max-width: 90vw; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: var(--green); } .toast.error { background: var(--red); }

.empty { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 13px; }
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; }

/* Schedule */
.rec-card { background: linear-gradient(135deg, #fff8f0, #fff5ec); border: 1px solid #f0dcc8; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.rec-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.rec-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255,255,255,0.7); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 12px; border: 1px solid rgba(240,220,200,0.5); }
.rec-time { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--accent); background: var(--accent-light); padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.rec-label { flex: 1; font-weight: 500; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wday { text-align: center; padding: 8px 2px; border-radius: var(--radius-sm); background: var(--bg-card-alt); border: 1px solid var(--border-light); }
.wday.today { background: var(--accent-light); border-color: var(--accent); }
.wday-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.wday-date { font-size: 16px; font-weight: 700; margin: 2px 0; }
.wday.today .wday-date { color: var(--accent); }
.wday-tasks { font-size: 8px; color: var(--text-secondary); line-height: 1.4; }

.ics-url-box { margin: 8px 0; padding: 10px; background: var(--accent-light); border-radius: 8px; border: 1px solid #f0dcc8; }
.ics-url-box code { font-size: 10px; word-break: break-all; background: none; padding: 0; display: block; font-family: var(--mono); }
.ics-copy-btn { margin-top: 6px; padding: 5px 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.gcal-embed { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); margin-bottom: 14px; background: var(--bg-card); }
.gcal-setup { padding: 24px 20px; color: var(--text-secondary); }
.gcal-setup h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); text-align: center; }
.gcal-setup p { font-size: 12px; line-height: 1.7; text-align: center; }
.gcal-setup .steps { text-align: left; margin-top: 12px; padding: 12px 16px; background: var(--bg-warm); border-radius: var(--radius-sm); font-size: 12px; }
.gcal-setup .steps li { margin-bottom: 6px; }
.cal-section { margin-top: 12px; }
.cal-section-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loadingScreen">
    <div style="font-size:36px">📚</div>
    <div style="font-size:13px;font-weight:600;color:var(--text-secondary)">読み込み中...</div>
  </div>
</div>

<!-- Review Complete Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>📝 学習完了！</h3>
    <div class="modal-item-name" id="modalItemName"></div>
    <div class="modal-field">
      <label>掌握度</label>
      <div class="modal-mastery-btns" id="modalMastery">
        <button class="mbtn" data-value="🟢 掌握" onclick="selectMastery(this)"><span class="emoji">🟢</span><span class="text">掌握</span></button>
        <button class="mbtn" data-value="🟡 半熟" onclick="selectMastery(this)"><span class="emoji">🟡</span><span class="text">半熟</span></button>
        <button class="mbtn" data-value="🔴 不会" onclick="selectMastery(this)"><span class="emoji">🔴</span><span class="text">不会</span></button>
      </div>
    </div>
    <div class="modal-field">
      <label>方法</label>
      <select id="modalMethod">
        <option value="✍️ 做题">✍️ 做题</option>
        <option value="📖 通读">📖 通读</option>
        <option value="🧠 回忆">🧠 回忆</option>
        <option value="📝 笔记">📝 笔记</option>
        <option value="🃏 Anki">🃏 Anki</option>
      </select>
    </div>
    <div class="modal-field">
      <label>备注</label>
      <textarea id="modalNotes" placeholder="记录你的想法..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="submitReview()">✓ 提交</button>
    </div>
  </div>
</div>

<!-- Reading Complete Modal -->
<div class="modal-overlay" id="readingModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>📖 阅读完了！</h3>
    <div class="modal-item-name" id="readingModalName"></div>
    <div class="modal-field">
      <label>读书笔记</label>
      <textarea id="readingNotes" placeholder="记录要点、页码、想法..." style="min-height:80px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeReadingModal()">取消</button>
      <button class="submit" onclick="submitReading()">✓ 记录</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== State =====
let DATA = null, currentTab = 0, selectedMastery = null;
let timer = { running: false, seconds: 0, interval: null, selectedItem: null, startTime: null, completedItems: new Set() };
let freeTab = 'past';    // 'past' | 'aiterm' | 'reading'
let aiMode = 'list';     // 'list' | 'flashcard'
let fcLec = 'all';
let fcIndex = 0;
let fcFlipped = false;
let expandedGroups = new Set();

const API = '/api/notion';
const SUBS = [
  { key: 'CS', icon: '💻' }, { key: 'AI', icon: '🤖' },
  { key: 'HCI', icon: '👥' }, { key: 'SE', icon: '⚙️' }, { key: 'IR', icon: '🔍' },
];
const BOOKS = [
  { name: 'Computer Science: An Overview', subject: 'CS', icon: '💻' },
  { name: 'Introduction to Information Retrieval', subject: 'IR', icon: '🔍' },
  { name: 'AI: A Modern Approach', subject: 'AI', icon: '🤖' },
  { name: 'HCI 参考書', subject: 'HCI', icon: '👥' },
  { name: 'Software Engineering', subject: 'SE', icon: '⚙️' },
];
const WEEK_PLAN = {
  1: ['💻 CS基礎', '🤖 AI知識'], 2: ['👥 HCI過去問', '⚙️ SE知識'],
  3: ['💻 CS過去問', '🔍 IR知識'], 4: ['🤖 AI過去問', '👥 HCI知識'],
  5: ['⚙️ SE過去問', '💻 CS弱点'], 6: ['📝 全科過去問', '🔧 弱点'], 0: ['📖 自由復習', '📓 整理'],
};

function getPri(str) { if (!str) return { label: '', cls: '' }; const m = str.match(/S|A|B|C|Critical|High|Medium|Low/); return m ? { label: m[0], cls: m[0] } : { label: '', cls: '' }; }

// ===== Init =====
async function init() {
  try {
    const r = await fetch(`${API}?action=getAll`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    DATA = await r.json();
    if (DATA.todayCompletedIds) DATA.todayCompletedIds.forEach(id => timer.completedItems.add(id));
    renderApp();
  } catch (e) {
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;color:var(--red)">
        <div style="font-size:28px;margin-bottom:8px">⚠️</div>
        <div style="font-size:14px;font-weight:600">読み込み失敗</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${e.message}</div>
        <button onclick="location.reload()" style="margin-top:14px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);font-weight:600">再試行</button>
      </div>`;
  }
}

// ===== Main Render =====
function renderApp() {
  const d = DATA;
  const tabs = [
    { icon: '📊', label: 'Overview' }, { icon: '📋', label: 'Review' },
    { icon: '📅', label: 'Schedule' }, { icon: '📈', label: 'Progress' },
  ];
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-top">
        <div class="header-title">🎯 京大社情</div>
        <div class="countdown-pill"><span class="days">${d.daysLeft}</span><span>days left</span></div>
      </div>
      <div class="tab-bar" id="tabBar">
        ${tabs.map((t, i) => `<button class="tab-btn ${i === currentTab ? 'active' : ''}" onclick="switchTab(${i})"><span class="tab-icon">${t.icon}</span><span>${t.label}</span></button>`).join('')}
        <div class="tab-indicator" id="tabInd"></div>
      </div>
    </div>
    <div class="page ${currentTab === 0 ? 'active' : ''}">${renderOverview(d)}</div>
    <div class="page ${currentTab === 1 ? 'active' : ''}">${renderReview(d)}</div>
    <div class="page ${currentTab === 2 ? 'active' : ''}">${renderSchedule(d)}</div>
    <div class="page ${currentTab === 3 ? 'active' : ''}">${renderProgress(d)}</div>
  `;
  updateIndicator(); updateTimerDisplay();
}

function switchTab(i) { currentTab = i; document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === i)); document.querySelectorAll('.page').forEach((p, idx) => p.classList.toggle('active', idx === i)); updateIndicator(); }
function updateIndicator() { const bar = document.getElementById('tabBar'), ind = document.getElementById('tabInd'); if (!bar || !ind) return; const btn = bar.querySelectorAll('.tab-btn')[currentTab]; if (btn) { ind.style.left = btn.offsetLeft + 'px'; ind.style.width = btn.offsetWidth + 'px'; } }

// ===== TAB 1: Overview =====
function renderOverview(d) {
  const studied = d.masteryStats.green + d.masteryStats.yellow + d.masteryStats.red;
  const autoPlan = d.dailyPlan?.plan || [];
  const completed = autoPlan.filter(i => timer.completedItems.has(i.id)).length;
  return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-emoji">🔥</div><div class="stat-value">${d.streak}</div><div class="stat-label">連続日数</div></div>
      <div class="stat-card"><div class="stat-emoji">⏱</div><div class="stat-value">${d.totalHours}<span class="unit">h</span></div><div class="stat-label">累計時間</div></div>
      <div class="stat-card"><div class="stat-emoji">📚</div><div class="stat-value">${studied}<span class="unit">/${d.masteryStats.total}</span></div><div class="stat-label">学習済</div></div>
      <div class="stat-card"><div class="stat-emoji">📋</div><div class="stat-value">${completed}<span class="unit">/${autoPlan.length}</span></div><div class="stat-label">今日復習</div></div>
    </div>
    ${renderHeatmap(d)}
    ${renderMastery(d)}
    ${renderAITermMastery(d)}
    ${renderQuickDue(d)}`;
}

function renderHeatmap(d) {
  const today = new Date(d.today + 'T00:00:00'); const weeks = 22;
  const start = new Date(today); start.setDate(start.getDate() - (weeks * 7) + (7 - start.getDay()));
  let html = '', cur = new Date(start);
  for (let w = 0; w < weeks; w++) {
    let wk = '';
    for (let dy = 0; dy < 7; dy++) {
      const ds = cur.toISOString().split('T')[0];
      const min = d.heatmap[ds] || 0;
      const lv = min === 0 ? '' : min < 30 ? 'l1' : min < 60 ? 'l2' : min < 120 ? 'l3' : 'l4';
      const t = ds === d.today ? 'today' : '';
      const f = cur > today;
      wk += `<div class="hm ${lv} ${t} ${f ? 'future' : ''}"></div>`;
      cur.setDate(cur.getDate() + 1);
    }
    html += `<div class="heatmap-week">${wk}</div>`;
  }
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📊</span> ヒートマップ</div><div class="card-badge">~5ヶ月</div></div>
    <div class="card-body"><div class="heatmap-scroll"><div class="heatmap-grid">
      <div class="heatmap-days"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div>
      ${html}</div></div>
      <div class="heatmap-legend"><span>Less</span>
        <div class="box" style="background:var(--bg-warm)"></div><div class="box" style="background:#e2d7c6"></div>
        <div class="box" style="background:#f0c06e"></div><div class="box" style="background:#e29840"></div>
        <div class="box" style="background:var(--accent)"></div><span>More</span>
      </div></div></div>`;
}

function renderMastery(d) {
  const subs = Object.entries(d.subjectStats).filter(([k]) => k).sort((a, b) => b[1].total - a[1].total);
  const rows = subs.map(([name, s]) => {
    const t = s.total || 1;
    return `<div class="mastery-row"><div class="mastery-info"><span class="mastery-name">${name}</span><span class="mastery-counts">🟢${s.green} 🟡${s.yellow} 🔴${s.red} ⚪${s.notStudied}</span></div>
      <div class="mastery-bar"><div class="g" style="width:${(s.green/t*100).toFixed(1)}%"></div><div class="y" style="width:${(s.yellow/t*100).toFixed(1)}%"></div><div class="r" style="width:${(s.red/t*100).toFixed(1)}%"></div></div></div>`;
  }).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">🎯</span> 過去問 Mastery</div></div><div class="card-body">${rows || '<div class="empty">No data</div>'}</div></div>`;
}

function renderAITermMastery(d) {
  if (!d.aiTermStats || d.aiTermStats.total === 0) return '';
  const s = d.aiTermStats, t = s.total || 1;
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">🤖</span> AI術語 Mastery</div><div class="card-badge">${s.total} terms</div></div>
    <div class="card-body"><div class="mastery-row"><div class="mastery-info"><span class="mastery-name">AI Terminology</span><span class="mastery-counts">🟢${s.green} 🟡${s.yellow} 🔴${s.red} ⚪${s.notStudied}</span></div>
      <div class="mastery-bar"><div class="g" style="width:${(s.green/t*100).toFixed(1)}%"></div><div class="y" style="width:${(s.yellow/t*100).toFixed(1)}%"></div><div class="r" style="width:${(s.red/t*100).toFixed(1)}%"></div></div></div></div></div>`;
}

function renderQuickDue(d) {
  const plan = d.dailyPlan?.plan || [];
  if (!plan.length) return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">✅</span> 今日の復習</div></div><div class="card-body"><div class="empty">今日は自動復習なし。自由選択で学習しよう！</div></div></div>`;
  const items = plan.filter(i => !timer.completedItems.has(i.id)).slice(0, 5).map(item => {
    const p = getPri(item.priority);
    const badge = item.source === 'aiTerm' ? 'term' : 'review';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light);cursor:pointer" onclick="switchTab(1)">
      <span class="qi-type-badge ${badge}">${item.source === 'aiTerm' ? '術語' : '復習'}</span>
      <span class="qi-sub ${item.subject}">${item.subject}</span>
      <span class="qi-name">${item.name}</span>
      ${p.label ? `<span class="qi-pri ${p.cls}">${p.label}</span>` : ''}
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📋</span> 今日の復習 (間隔反復)</div>
    <button class="card-badge" onclick="switchTab(1)" style="cursor:pointer;border:none;font-family:var(--font)">全て見る →</button>
    </div><div class="card-body" style="padding-top:0">${items}</div></div>`;
}

// ===== TAB 2: Review (Major Redesign) =====
function renderReview(d) {
  const activeHtml = timer.selectedItem
    ? `<div class="timer-active">
        <div style="flex:1;min-width:0"><div class="lbl">正在学習</div><div class="name">${timer.selectedItem.name}</div></div>
        ${timer.selectedItem.url ? `<a class="notion-link" href="${timer.selectedItem.url}" target="_blank" rel="noopener">📖 Notion</a>` : ''}
      </div>`
    : `<div class="timer-active empty"><div style="flex:1"><div class="lbl">选择项目</div><div class="name">从下方列表选择开始</div></div></div>`;

  // Auto-push section (interval repetition)
  const autoPlan = d.dailyPlan?.plan || [];
  let autoHtml = '';
  if (autoPlan.length > 0) {
    autoHtml = autoPlan.map(item => renderQueueItem(item, item.queueType)).join('');
  } else {
    autoHtml = '<div class="empty">今日自動復習なし 🎉</div>';
  }

  // Free selection sub-tabs
  const freeTabHtml = `
    <div class="sub-tabs">
      <button class="sub-tab ${freeTab === 'past' ? 'active' : ''}" onclick="setFreeTab('past')">📝 過去問</button>
      <button class="sub-tab ${freeTab === 'aiterm' ? 'active' : ''}" onclick="setFreeTab('aiterm')">🤖 AI術語</button>
      <button class="sub-tab ${freeTab === 'reading' ? 'active' : ''}" onclick="setFreeTab('reading')">📖 教材</button>
    </div>`;

  let freeContent = '';
  if (freeTab === 'past') freeContent = renderFreeItems(d);
  else if (freeTab === 'aiterm') freeContent = renderFreeAITerms(d);
  else freeContent = renderFreeReading();

  return `
    <div class="timer-card">
      <div class="timer-display ${timer.running ? 'running' : ''}" id="timerDisplay">${fmtTime(timer.seconds)}</div>
      <div class="timer-controls">
        ${timer.running ? `<button class="tbtn stop" onclick="stopTimer()">⏹ 停止</button>` : `<button class="tbtn start" onclick="startTimer()">▶ 開始</button>`}
        <button class="tbtn reset" onclick="resetTimer()">↻</button>
      </div>
      ${activeHtml}
    </div>

    <div class="card" style="overflow:visible">
      <div class="card-header"><div class="card-title"><span class="icon">🔄</span> 今日の自動復習</div><div class="card-badge">${autoPlan.filter(i => !timer.completedItems.has(i.id)).length}/${autoPlan.length}</div></div>
      <div class="queue-list" style="max-height:35vh">${autoHtml}</div>
    </div>

    <div class="card" style="overflow:visible">
      <div class="card-header"><div class="card-title"><span class="icon">📂</span> 自由選択</div></div>
      ${freeTabHtml}
      ${freeContent}
    </div>`;
}

function renderQueueItem(item, type) {
  const p = getPri(item.priority);
  const sel = timer.selectedItem?.id === item.id;
  const done = timer.completedItems.has(item.id);
  const isTerm = item.source === 'aiTerm';
  const badge = type === 'review-term' ? 'term' : type === 'review' ? 'review' : 'new';
  const badgeText = isTerm ? '術語' : type === 'review' || type === 'review-term' ? '復習' : 'NEW';
  return `<div class="qi ${sel ? 'selected' : ''} ${done ? 'completed' : ''}" onclick="${isTerm ? `selectTermAndStart('${item.id}')` : `selectAndStart('${item.id}')`}">
    <div class="qi-check">${done ? '✓' : ''}</div>
    <span class="qi-type-badge ${badge}">${badgeText}</span>
    <span class="qi-sub ${item.subject}">${item.subject || '?'}</span>
    <span class="qi-name" title="${item.name}">${item.name || '(untitled)'}</span>
    ${item.mastery ? `<span class="qi-mastery">${item.mastery}</span>` : ''}
    ${p.label ? `<span class="qi-pri ${p.cls}">${p.label}</span>` : ''}
    ${item.url ? `<a class="qi-notion" href="${item.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖</a>` : ''}
    ${!done ? `<button class="qi-done-btn" onclick="event.stopPropagation();${isTerm ? `quickCompleteTerm('${item.id}')` : `quickComplete('${item.id}')`}">完了</button>` : ''}
  </div>`;
}

// ===== Free Selection: 過去問 by Year =====
function renderFreeItems(d) {
  const years = Object.keys(d.itemsByYear || {}).sort((a, b) => b.localeCompare(a));
  if (!years.length) return '<div class="empty">まだ問題がありません</div>';
  return `<div class="queue-list" style="max-height:50vh">${years.map(yr => {
    const items = d.itemsByYear[yr];
    const open = expandedGroups.has('yr-' + yr);
    return `
      <div class="group-header" onclick="toggleGroup('yr-${yr}')">
        <span class="group-arrow ${open ? 'open' : ''}">▶</span>
        <span class="group-label">${yr}</span>
        <span class="group-count">${items.length}問</span>
      </div>
      <div class="group-items ${open ? 'open' : ''}">${items.map(item => renderQueueItem(item, 'new')).join('')}</div>`;
  }).join('')}</div>`;
}

// ===== Free Selection: AI Terms by Lec =====
function renderFreeAITerms(d) {
  const terms = d.aiTerms || [];
  if (!terms.length) return '<div class="empty">AI terminology がまだありません</div>';

  // Mode toggle
  const modeHtml = `<div style="padding:14px 16px 0">
    <div class="mode-toggle">
      <button class="${aiMode === 'list' ? 'active' : ''}" onclick="setAIMode('list')">📋 リスト</button>
      <button class="${aiMode === 'flashcard' ? 'active' : ''}" onclick="setAIMode('flashcard')">🃏 フラッシュカード</button>
    </div></div>`;

  if (aiMode === 'flashcard') return modeHtml + renderFlashcard(d);

  // List mode grouped by Lec
  const lecs = Object.keys(d.termsByLec || {}).sort();
  return modeHtml + `<div class="queue-list" style="max-height:50vh">${lecs.map(lec => {
    const items = d.termsByLec[lec];
    const open = expandedGroups.has('lec-' + lec);
    return `
      <div class="group-header" onclick="toggleGroup('lec-${lec}')">
        <span class="group-arrow ${open ? 'open' : ''}">▶</span>
        <span class="group-label">${lec}</span>
        <span class="group-count">${items.length} terms</span>
      </div>
      <div class="group-items ${open ? 'open' : ''}">${items.map(term => renderQueueItem(term, 'new')).join('')}</div>`;
  }).join('')}</div>`;
}

// ===== Flashcard Mode =====
function renderFlashcard(d) {
  const allTerms = d.aiTerms || [];
  const lecs = ['all', ...Object.keys(d.termsByLec || {}).sort()];
  const filtered = fcLec === 'all' ? allTerms : (d.termsByLec?.[fcLec] || []);
  if (!filtered.length) return '<div class="empty">選択したLecに術語がありません</div>';

  if (fcIndex >= filtered.length) fcIndex = 0;
  const term = filtered[fcIndex];

  const lecBtns = lecs.map(l => `<button class="fc-lec-btn ${fcLec === l ? 'active' : ''}" onclick="setFCLec('${l}')">${l === 'all' ? '全部' : l}</button>`).join('');

  return `<div class="flashcard-container">
    <div class="fc-lec-select">${lecBtns}</div>
    <div class="flashcard ${fcFlipped ? 'flipped' : ''}" onclick="flipCard()">
      <div class="fc-label">${fcFlipped ? 'DEFINITION' : 'TERMINOLOGY'}</div>
      <div class="fc-term">${term.name}</div>
      <div class="fc-definition">${term.definition || '(no definition)'}</div>
      <div class="fc-meta">${term.lec || ''} · ${term.part || ''} ${term.mastery ? '· ' + term.mastery : ''}</div>
    </div>
    <div class="fc-progress">${fcIndex + 1} / ${filtered.length}</div>
    <div class="fc-nav">
      <button class="fc-prev" onclick="fcPrev(${filtered.length})">← 前</button>
      <button class="fc-next" onclick="fcNext(${filtered.length})">次 →</button>
    </div>
    <div class="fc-mastery-btns">
      <button class="fc-mbtn g" onclick="fcRate('${term.id}','🟢 掌握')">🟢 掌握</button>
      <button class="fc-mbtn y" onclick="fcRate('${term.id}','🟡 半熟')">🟡 半熟</button>
      <button class="fc-mbtn r" onclick="fcRate('${term.id}','🔴 不会')">🔴 不会</button>
    </div>
  </div>`;
}

// ===== Free Selection: Reading =====
function renderFreeReading() {
  return BOOKS.map(b => {
    const active = timer.selectedItem?.name === b.name && timer.selectedItem?.source === 'reading';
    return `<div class="book-item ${active ? 'active' : ''}" onclick="selectBook('${b.name}','${b.subject}')">
      <div class="book-icon">${b.icon}</div>
      <div class="book-info"><div class="book-name">${b.name}</div><div class="book-sub">${b.subject}</div></div>
    </div>`;
  }).join('');
}

// ===== TAB 3: Schedule =====
function renderSchedule(d) {
  const dp = d.dailyPlan || {};
  const plan = dp.plan || [];
  const now = new Date(); const isWE = now.getDay() === 0 || now.getDay() === 6;
  const sched = [];
  if (isWE) {
    if (plan.length) sched.push({ time: '9:00', label: `🔄 復習 (${plan.length}題)` });
    sched.push({ time: '15:00', label: '📝 ノート整理 + 打卡' });
    sched.push({ time: '16:00', label: '🔧 弱点復習 / 自由選択' });
  } else {
    sched.push({ time: '7:00', label: '📖 通勤学習' });
    sched.push({ time: '12:00', label: '🔄 昼休み復習 (15min)' });
    if (plan.length) sched.push({ time: '19:30', label: `📚 集中学習 (${plan.length}題)` });
    sched.push({ time: '21:30', label: '📝 Notion打卡' });
  }
  const schedHtml = sched.map(s => `<div class="rec-item"><span class="rec-time">${s.time}</span><span class="rec-label">${s.label}</span></div>`).join('');
  const icsUrl = `${window.location.origin}/api/notion?action=ics`;
  return `
    <div class="rec-card">
      <div class="rec-title">🧠 今日の学習プラン (${isWE ? '週末' : '平日'})</div>
      ${schedHtml}
    </div>
    <div class="gcal-embed"><div class="gcal-setup">
      <h3>📅 カレンダー連携</h3>
      <p>学習プランを自動で同期</p>
      <div class="ics-url-box"><code>${icsUrl}</code><button class="ics-copy-btn" onclick="copyIcsUrl()">📋 URLをコピー</button></div>
    </div></div>
    ${renderWeekPlan()}`;
}

function renderWeekPlan() {
  const today = new Date(); const mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const isT = d.toDateString() === today.toDateString();
    const tasks = WEEK_PLAN[d.getDay()] || [];
    html += `<div class="wday ${isT ? 'today' : ''}"><div class="wday-label">${names[i]}</div><div class="wday-date">${d.getDate()}</div><div class="wday-tasks">${tasks.join('<br>')}</div></div>`;
  }
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📅</span> 週間計画</div></div><div class="card-body"><div class="week-grid">${html}</div></div></div>`;
}

// ===== TAB 4: Progress =====
function renderProgress(d) { return `${renderMastery(d)}${renderAITermMastery(d)}${renderPhases(d)}${renderLogs(d)}`; }

function renderPhases(d) {
  const phases = [
    { key: 'Phase 0 热身', name: 'P0 热身', cls: 'p0', color: '#9e9e9e', target: 7 },
    { key: 'Phase 1 基础', name: 'P1 基礎', cls: 'p1', color: 'var(--blue)', target: 60 },
    { key: 'Phase 2 过去问', name: 'P2 過去問', cls: 'p2', color: 'var(--accent)', target: 60 },
    { key: 'Phase 3 弱点攻克', name: 'P3 弱点攻克', cls: 'p3', color: 'var(--red)', target: 30 },
    { key: 'Phase 4 冲刺', name: 'P4 衝刺', cls: 'p4', color: 'var(--purple)', target: 14 },
  ];
  const rows = phases.map(p => {
    const data = d.phaseItems[p.key] || { count: 0, totalMinutes: 0 };
    const pct = Math.min(100, data.count / p.target * 100).toFixed(0);
    return `<div class="phase-item"><div class="phase-dot ${p.cls}">${p.cls.charAt(1)}</div><div class="phase-info">
      <div class="phase-name">${p.name}</div><div class="phase-meta">${data.count}日/${p.target}日 · ${Math.round(data.totalMinutes/60)}h</div>
      <div class="phase-bar"><div class="phase-fill" style="width:${pct}%;background:${p.color}"></div></div></div></div>`;
  }).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">🎯</span> Phase Progress</div></div><div class="card-body">${rows}</div></div>`;
}

function renderLogs(d) {
  const items = d.logs.slice(0, 15).map(l =>
    `<div class="log-item">
      <span class="log-date">${l.reviewDate || '—'}</span>
      <span class="log-title">${l.title}</span>
      <span class="log-time">${l.timeSpent}min ${l.mastery || ''}</span>
    </div>`
  ).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📝</span> 学習記録</div></div>
    <div class="card-body">${items || '<div class="empty">まだ記録がありません</div>'}</div></div>`;
}

// ===== Timer =====
function fmtTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function startTimer() {
  if (timer.running) return;
  timer.running = true;
  timer.startTime = new Date().toISOString();
  timer.interval = setInterval(() => { timer.seconds++; updateTimerDisplay(); }, 1000);
  renderApp();
}
function stopTimer() {
  if (!timer.running) return;
  clearInterval(timer.interval); timer.running = false;
  const min = Math.round(timer.seconds / 60);
  if (timer.selectedItem) {
    if (timer.selectedItem.source === 'reading') { showReadingModal(timer.selectedItem); }
    else if (timer.selectedItem.source === 'aiTerm') { showModal(timer.selectedItem, min); }
    else if (min >= 1) { showModal(timer.selectedItem, min); }
  } else if (min >= 1) { showToast(`${min}分の学習を記録`, 'success'); }
  renderApp();
}
function resetTimer() {
  clearInterval(timer.interval);
  timer.running = false; timer.seconds = 0; timer.selectedItem = null; timer.startTime = null;
  renderApp();
}
function updateTimerDisplay() { const el = document.getElementById('timerDisplay'); if (el) el.textContent = fmtTime(timer.seconds); }

// ===== Select & Start (2026 items) =====
function selectAndStart(id) {
  if (timer.completedItems.has(id)) return;
  // Find in all possible sources
  let item = DATA.items?.find(i => i.id === id);
  if (!item) { const plan = DATA.dailyPlan?.plan || []; item = plan.find(i => i.id === id); }
  if (!item) return;

  if (timer.running && timer.selectedItem && timer.selectedItem.id !== id) {
    clearInterval(timer.interval); timer.running = false;
    const min = Math.round(timer.seconds / 60);
    if (min >= 1) { showModal(timer.selectedItem, min); return; }
  }

  timer.selectedItem = item;
  if (!timer.running) {
    timer.seconds = 0; timer.running = true;
    timer.startTime = new Date().toISOString();
    timer.interval = setInterval(() => { timer.seconds++; updateTimerDisplay(); }, 1000);
  }
  if (item.url) window.open(item.url, '_blank');
  renderApp();
}

// ===== Select & Start (AI Terms) =====
function selectTermAndStart(id) {
  if (timer.completedItems.has(id)) return;
  let term = DATA.aiTerms?.find(t => t.id === id);
  if (!term) { const plan = DATA.dailyPlan?.plan || []; term = plan.find(i => i.id === id); }
  if (!term) return;

  if (timer.running && timer.selectedItem && timer.selectedItem.id !== id) {
    clearInterval(timer.interval); timer.running = false;
    const min = Math.round(timer.seconds / 60);
    if (min >= 1) { showModal(timer.selectedItem, min); return; }
  }

  timer.selectedItem = term;
  if (!timer.running) {
    timer.seconds = 0; timer.running = true;
    timer.startTime = new Date().toISOString();
    timer.interval = setInterval(() => { timer.seconds++; updateTimerDisplay(); }, 1000);
  }
  if (term.url) window.open(term.url, '_blank');
  renderApp();
}

// ===== Select Book (Reading) =====
function selectBook(name, subject) {
  if (timer.running && timer.selectedItem) {
    clearInterval(timer.interval); timer.running = false;
    if (timer.selectedItem.source === 'reading') { showReadingModal(timer.selectedItem); return; }
    const min = Math.round(timer.seconds / 60);
    if (min >= 1) { showModal(timer.selectedItem, min); return; }
  }
  timer.selectedItem = { name, subject, source: 'reading', id: 'book-' + name };
  timer.seconds = 0; timer.running = true;
  timer.startTime = new Date().toISOString();
  timer.interval = setInterval(() => { timer.seconds++; updateTimerDisplay(); }, 1000);
  renderApp();
}

// ===== Quick Complete =====
function quickComplete(id) {
  const item = DATA.items?.find(i => i.id === id) || (DATA.dailyPlan?.plan || []).find(i => i.id === id);
  if (item) { timer.selectedItem = item; showModal(item, 0); }
}
function quickCompleteTerm(id) {
  const term = DATA.aiTerms?.find(t => t.id === id) || (DATA.dailyPlan?.plan || []).find(i => i.id === id);
  if (term) { timer.selectedItem = term; showModal(term, 0); }
}

// ===== Free tab / AI mode / Groups =====
function setFreeTab(t) { freeTab = t; renderApp(); }
function setAIMode(m) { aiMode = m; fcIndex = 0; fcFlipped = false; renderApp(); }
function toggleGroup(key) { if (expandedGroups.has(key)) expandedGroups.delete(key); else expandedGroups.add(key); renderApp(); }
function setFCLec(l) { fcLec = l; fcIndex = 0; fcFlipped = false; renderApp(); }
function flipCard() { fcFlipped = !fcFlipped; renderApp(); }
function fcPrev(len) { fcIndex = (fcIndex - 1 + len) % len; fcFlipped = false; renderApp(); }
function fcNext(len) { fcIndex = (fcIndex + 1) % len; fcFlipped = false; renderApp(); }

// ===== Flashcard Rate =====
async function fcRate(termId, mastery) {
  showToast('記録中...', '');
  try {
    const endTime = new Date().toISOString();
    const startTime = endTime; // instant
    const term = DATA.aiTerms?.find(t => t.id === termId);
    await fetch(`${API}?action=complete-term-review`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        termId, termName: term?.name || '', mastery,
        method: '🃏 Anki', startTime, endTime,
      }),
    });
    timer.completedItems.add(termId);
    showToast(`✓ ${term?.name || ''} 記録完了！`, 'success');
    // Auto advance
    const allTerms = DATA.aiTerms || [];
    const filtered = fcLec === 'all' ? allTerms : (DATA.termsByLec?.[fcLec] || []);
    if (fcIndex < filtered.length - 1) fcIndex++;
    fcFlipped = false;
    setTimeout(async () => { const r = await fetch(`${API}?action=getAll`); DATA = await r.json(); if (DATA.todayCompletedIds) DATA.todayCompletedIds.forEach(id => timer.completedItems.add(id)); renderApp(); }, 1500);
  } catch (e) { showToast('失敗: ' + e.message, 'error'); }
}

// ===== Modal (Study Item / AI Term) =====
function showModal(item, minutes) {
  selectedMastery = null;
  document.getElementById('modalItemName').textContent = `${item.subject || ''} · ${item.name}`;
  document.getElementById('modalNotes').value = '';
  document.querySelectorAll('#reviewModal .mbtn').forEach(b => b.classList.remove('selected'));
  document.getElementById('reviewModal').classList.add('show');
  window._rd = { item, minutes };
}
function closeModal() { document.getElementById('reviewModal').classList.remove('show'); }
function selectMastery(btn) {
  document.querySelectorAll('#reviewModal .mbtn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMastery = btn.dataset.value;
}

async function submitReview() {
  if (!selectedMastery) { showToast('掌握度を選んでください', 'error'); return; }
  const { item, minutes } = window._rd;
  const endTimeISO = new Date().toISOString();
  const startTimeISO = timer.startTime || new Date(Date.now() - (minutes || 1) * 60000).toISOString();
  closeModal(); showToast('記録中...', '');

  try {
    const isTerm = item.source === 'aiTerm';
    const action = isTerm ? 'complete-term-review' : 'complete-review';
    const body = isTerm ? {
      termId: item.id, termName: item.name,
      mastery: selectedMastery,
      method: document.getElementById('modalMethod').value,
      notes: document.getElementById('modalNotes').value,
      startTime: startTimeISO, endTime: endTimeISO,
    } : {
      studyItemId: item.id, studyItemName: item.name,
      subject: item.subject,
      timeSpent: minutes || Math.round((new Date(endTimeISO) - new Date(startTimeISO)) / 60000) || 1,
      mastery: selectedMastery,
      method: document.getElementById('modalMethod').value,
      notes: document.getElementById('modalNotes').value,
      startTime: startTimeISO, endTime: endTimeISO,
    };

    await fetch(`${API}?action=${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    timer.completedItems.add(item.id);
    timer.seconds = 0; timer.selectedItem = null; timer.startTime = null;
    showToast(`✓ ${item.name} 記録完了！`, 'success');
    setTimeout(async () => { const r = await fetch(`${API}?action=getAll`); DATA = await r.json(); if (DATA.todayCompletedIds) DATA.todayCompletedIds.forEach(id => timer.completedItems.add(id)); renderApp(); }, 1500);
  } catch (e) { showToast('失敗: ' + e.message, 'error'); }
}

// ===== Reading Modal =====
function showReadingModal(item) {
  document.getElementById('readingModalName').textContent = `📖 ${item.name}`;
  document.getElementById('readingNotes').value = '';
  document.getElementById('readingModal').classList.add('show');
  window._readingData = { item };
}
function closeReadingModal() { document.getElementById('readingModal').classList.remove('show'); }
async function submitReading() {
  const { item } = window._readingData;
  const endTimeISO = new Date().toISOString();
  const startTimeISO = timer.startTime || endTimeISO;
  closeReadingModal(); showToast('記録中...', '');
  try {
    await fetch(`${API}?action=complete-reading`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bookName: item.name, subject: item.subject,
        startTime: startTimeISO, endTime: endTimeISO,
        notes: document.getElementById('readingNotes').value,
      }),
    });
    timer.seconds = 0; timer.selectedItem = null; timer.startTime = null;
    showToast(`✓ 阅读记录完了！`, 'success');
    setTimeout(async () => { const r = await fetch(`${API}?action=getAll`); DATA = await r.json(); renderApp(); }, 1500);
  } catch (e) { showToast('失敗: ' + e.message, 'error'); }
}

// ===== Toast & Clipboard =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || '');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 3000);
}
function copyIcsUrl() {
  const url = `${window.location.origin}/api/notion?action=ics`;
  navigator.clipboard.writeText(url).then(() => showToast('📋 URLをコピーしました！', 'success')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); showToast('📋 URLをコピーしました！', 'success');
  });
}

window.addEventListener('resize', updateIndicator);
init();
</script>

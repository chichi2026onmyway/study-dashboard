<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>京大社情 Study Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #f8f5f0;
  --bg-card: #ffffff;
  --bg-card-alt: #fefcf9;
  --bg-warm: #f3ede4;
  --bg-hover: #ede7dc;
  --border: #e6ddd1;
  --border-light: #efe8dc;
  --text: #2c2925;
  --text-secondary: #767066;
  --text-muted: #a49b8e;
  --accent: #d97036;
  --accent-light: #fdf0e5;
  --accent-hover: #c4622b;
  --green: #3d9e6e;
  --green-light: #e6f4ec;
  --yellow: #e5a821;
  --yellow-light: #fef7e0;
  --red: #d9534f;
  --red-light: #fdecea;
  --blue: #4a80e0;
  --blue-light: #e7effc;
  --purple: #8b6cc1;
  --purple-light: #f0ebf7;
  --shadow-xs: 0 1px 2px rgba(44,41,37,0.04);
  --shadow-sm: 0 1px 4px rgba(44,41,37,0.06), 0 1px 2px rgba(44,41,37,0.04);
  --shadow-md: 0 4px 16px rgba(44,41,37,0.08);
  --shadow-lg: 0 8px 32px rgba(44,41,37,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --font: 'DM Sans', 'Noto Sans JP', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== App Shell ===== */
.app { max-width: 640px; margin: 0 auto; min-height: 100dvh; position: relative; }

/* ===== Header ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(248,245,240,0.85);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border-light);
  padding: 12px 20px 0;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.countdown-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  background: linear-gradient(135deg, var(--accent), #e8884a);
  border-radius: 20px; color: #fff;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(217,112,54,0.3);
}
.countdown-pill .days { font-family: var(--mono); font-size: 18px; font-weight: 700; line-height: 1; }

/* ===== Tab Bar ===== */
.tab-bar { display: flex; gap: 0; position: relative; }
.tab-btn {
  flex: 1; padding: 10px 0 12px;
  font-size: 12px; font-weight: 600;
  color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color var(--transition);
  position: relative; letter-spacing: 0.2px;
}
.tab-btn .tab-icon { font-size: 18px; line-height: 1; }
.tab-btn.active { color: var(--accent); }
.tab-indicator {
  position: absolute; bottom: 0; height: 2.5px;
  background: var(--accent); border-radius: 2px 2px 0 0;
  transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Pages ===== */
.page {
  display: none; padding: 16px 20px 100px;
  animation: fadeIn 0.25s ease;
}
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Card ===== */
.card {
  background: var(--bg-card); border-radius: var(--radius);
  border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
  margin-bottom: 14px; overflow: hidden;
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
}
.card-title {
  font-size: 13px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 7px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-title .icon { font-size: 15px; }
.card-badge {
  font-size: 11px; padding: 2px 9px;
  background: var(--bg-warm); color: var(--text-secondary);
  border-radius: 20px; font-weight: 600;
}
.card-body { padding: 4px 18px 16px; }

/* ===== Stats Row ===== */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card {
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 14px 12px; text-align: center;
  border: 1px solid var(--border-light); box-shadow: var(--shadow-xs);
  transition: all var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.stat-emoji { font-size: 20px; margin-bottom: 4px; }
.stat-value { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
.stat-value .unit { font-size: 12px; color: var(--text-muted); font-weight: 500; }
.stat-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; letter-spacing: 0.3px; }

/* ===== Heatmap ===== */
.heatmap-scroll { overflow-x: auto; padding: 4px 0; }
.heatmap-grid { display: flex; gap: 3px; }
.heatmap-days { display: flex; flex-direction: column; gap: 3px; margin-right: 4px; }
.heatmap-days span { height: 12px; font-size: 8px; color: var(--text-muted); display: flex; align-items: center; line-height: 1; }
.heatmap-week { display: flex; flex-direction: column; gap: 3px; }
.hm {
  width: 12px; height: 12px; border-radius: 2.5px;
  background: var(--bg-warm); transition: transform 0.1s; position: relative;
}
.hm:hover { transform: scale(1.5); z-index: 1; }
.hm[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
  padding: 3px 7px; background: var(--text); color: #fff;
  font-size: 9px; border-radius: 4px; white-space: nowrap; z-index: 5; pointer-events: none;
}
.hm.l1 { background: #e2d7c6; }
.hm.l2 { background: #f0c06e; }
.hm.l3 { background: #e29840; }
.hm.l4 { background: var(--accent); }
.hm.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.hm.future { opacity: 0.25; }
.heatmap-legend {
  display: flex; align-items: center; gap: 3px;
  justify-content: flex-end; margin-top: 8px; font-size: 9px; color: var(--text-muted);
}
.heatmap-legend .box { width: 12px; height: 12px; border-radius: 2.5px; }

/* ===== Mastery Bars ===== */
.mastery-row { margin-bottom: 12px; }
.mastery-row:last-child { margin-bottom: 0; }
.mastery-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.mastery-name { font-size: 13px; font-weight: 600; }
.mastery-counts { font-size: 10px; color: var(--text-muted); font-weight: 500; }
.mastery-bar { height: 8px; border-radius: 4px; background: var(--bg-warm); overflow: hidden; display: flex; }
.mastery-bar .g { background: var(--green); transition: width 0.6s ease; }
.mastery-bar .y { background: var(--yellow); transition: width 0.6s ease; }
.mastery-bar .r { background: var(--red); transition: width 0.6s ease; }

/* ===== Timer Card ===== */
.timer-card {
  background: var(--bg-card); border-radius: var(--radius);
  border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
  padding: 24px 20px; text-align: center; margin-bottom: 14px;
}
.timer-subjects { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.tsub {
  padding: 5px 14px; border: 2px solid var(--border); border-radius: 20px;
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  transition: all 0.15s; display: flex; align-items: center; gap: 4px;
}
.tsub:hover { border-color: var(--accent); color: var(--accent); }
.tsub.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.timer-display {
  font-family: var(--mono); font-size: 56px; font-weight: 700;
  color: var(--text); letter-spacing: 2px; line-height: 1; margin: 4px 0 16px;
  transition: color 0.3s;
}
.timer-display.running { color: var(--accent); }
.timer-controls { display: flex; gap: 10px; justify-content: center; }
.tbtn {
  padding: 10px 28px; border-radius: 12px;
  font-size: 14px; font-weight: 600; transition: all 0.15s;
}
.tbtn.start { background: var(--green); color: #fff; }
.tbtn.start:hover { background: #358c60; }
.tbtn.stop { background: var(--red); color: #fff; }
.tbtn.stop:hover { background: #c4443f; }
.tbtn.reset { background: var(--bg-warm); color: var(--text-secondary); }
.tbtn.reset:hover { background: var(--bg-hover); }
.timer-active {
  margin-top: 14px; padding: 8px 14px;
  background: var(--accent-light); border-radius: var(--radius-sm); border: 1px solid #f0dcc8;
}
.timer-active .lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.timer-active .name { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer-active.empty { background: var(--bg-warm); border-color: var(--border); }
.timer-active.empty .lbl { color: var(--text-muted); }
.timer-active.empty .name { color: var(--text-secondary); font-weight: 400; font-size: 12px; }

/* ===== Queue ===== */
.queue-filters {
  display: flex; gap: 5px; padding: 10px 16px;
  overflow-x: auto; border-bottom: 1px solid var(--border-light);
}
.qf {
  padding: 4px 12px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 16px;
  color: var(--text-secondary); white-space: nowrap;
  transition: all 0.15s; flex-shrink: 0;
}
.qf:hover { border-color: var(--accent); color: var(--accent); }
.qf.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.queue-list { max-height: 55vh; overflow-y: auto; }

/* Queue Section Dividers */
.queue-section {
  padding: 8px 16px 4px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card-alt);
}
.queue-section .line { flex: 1; height: 1px; background: var(--border-light); }
.queue-section.review-section { color: var(--accent); }
.queue-section.new-section { color: var(--blue); }

.qi {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid var(--border-light);
  transition: all 0.15s; cursor: pointer;
}
.qi:last-child { border-bottom: none; }
.qi:hover { background: var(--bg-warm); }
.qi.selected { background: var(--accent-light); }
.qi.completed { opacity: 0.4; }
.qi-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 10px; transition: all 0.15s;
}
.qi.completed .qi-check { background: var(--green); border-color: var(--green); color: #fff; }
.qi-type-tag {
  font-size: 8px; font-weight: 800; padding: 1px 5px;
  border-radius: 3px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.5px;
}
.qi-type-tag.new { background: var(--blue-light); color: var(--blue); }
.qi-type-tag.review { background: var(--accent-light); color: var(--accent); }
.qi-sub {
  font-size: 9px; font-weight: 700; padding: 2px 7px;
  border-radius: 4px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.3px;
}
.qi-sub.CS { background: #fef3e2; color: #b8700f; }
.qi-sub.AI { background: #e6f4ec; color: #2d8055; }
.qi-sub.HCI { background: #fdecea; color: #b83b36; }
.qi-sub.SE { background: #f0ebf7; color: #6b4fa0; }
.qi-sub.IR { background: #e7effc; color: #3567b8; }
.qi-name {
  flex: 1; font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.qi-pri {
  font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
}
.qi-pri.S { background: var(--red-light); color: var(--red); }
.qi-pri.A { background: #fff3e0; color: #c75600; }
.qi-pri.B { background: var(--yellow-light); color: #b8860b; }
.qi-pri.C { background: var(--green-light); color: var(--green); }
.qi-mastery { font-size: 13px; flex-shrink: 0; }
.qi-done-btn {
  padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 600;
  background: var(--green); color: #fff; flex-shrink: 0;
  opacity: 0; transition: opacity 0.15s;
}
.qi:hover .qi-done-btn { opacity: 1; }
.qi.completed .qi-done-btn { display: none; }

/* ===== Daily Plan Summary Card ===== */
.plan-summary {
  background: linear-gradient(135deg, #fff8f0, #fff5ec);
  border: 1px solid #f0dcc8; border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px;
}
.plan-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.plan-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.plan-meta { font-size: 11px; color: var(--text-secondary); }
.plan-stats {
  display: flex; gap: 12px; margin-bottom: 12px;
}
.plan-stat {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: rgba(255,255,255,0.7);
  border-radius: var(--radius-xs); border: 1px solid rgba(240,220,200,0.4);
  font-size: 12px;
}
.plan-stat .num { font-family: var(--mono); font-weight: 700; font-size: 16px; }
.plan-stat .lbl { color: var(--text-secondary); font-size: 10px; font-weight: 600; }
.plan-stat.new-stat .num { color: var(--blue); }
.plan-stat.review-stat .num { color: var(--accent); }
.plan-stat.time-stat .num { color: var(--green); }

/* Progress ring */
.plan-progress {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: rgba(255,255,255,0.6);
  border-radius: var(--radius-sm); border: 1px solid rgba(240,220,200,0.3);
}
.progress-ring { width: 44px; height: 44px; flex-shrink: 0; }
.progress-ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.progress-ring .bg { stroke: var(--bg-warm); }
.progress-ring .fg { stroke: var(--accent); transition: stroke-dashoffset 0.6s ease; }
.plan-progress-text { flex: 1; }
.plan-progress-text .big { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.plan-progress-text .small { font-size: 11px; color: var(--text-secondary); }

/* ===== Calendar Page ===== */
.gcal-embed {
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
  margin-bottom: 14px; background: var(--bg-card);
}
.gcal-embed iframe { width: 100%; height: 400px; border: none; display: block; }
.gcal-setup { padding: 24px 20px; text-align: center; color: var(--text-secondary); }
.gcal-setup h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
.gcal-setup p { font-size: 12px; line-height: 1.7; }
.gcal-setup .steps {
  text-align: left; margin-top: 12px; padding: 12px 16px;
  background: var(--bg-warm); border-radius: var(--radius-sm); font-size: 12px;
}
.gcal-setup .steps li { margin-bottom: 6px; }
.gcal-setup code {
  display: inline-block; margin-top: 8px; padding: 6px 12px;
  background: var(--bg-warm); border-radius: var(--radius-xs);
  font-family: var(--mono); font-size: 11px; word-break: break-all;
}

/* Smart Recommendations */
.rec-card {
  background: linear-gradient(135deg, #fff8f0, #fff5ec);
  border: 1px solid #f0dcc8; border-radius: var(--radius);
  padding: 16px 18px; margin-bottom: 14px;
}
.rec-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.rec-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: rgba(255,255,255,0.7);
  border-radius: var(--radius-sm); margin-bottom: 6px;
  font-size: 12px; border: 1px solid rgba(240,220,200,0.5);
}
.rec-item:last-child { margin-bottom: 0; }
.rec-time {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  color: var(--accent); background: var(--accent-light);
  padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
}
.rec-label { flex: 1; font-weight: 500; }

/* Week Grid */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wday {
  text-align: center; padding: 8px 2px; border-radius: var(--radius-sm);
  background: var(--bg-card-alt); border: 1px solid var(--border-light); transition: all 0.15s;
}
.wday.today { background: var(--accent-light); border-color: var(--accent); }
.wday-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.wday-date { font-size: 16px; font-weight: 700; margin: 2px 0; }
.wday.today .wday-date { color: var(--accent); }
.wday-tasks { font-size: 8px; color: var(--text-secondary); line-height: 1.4; }

/* ===== Phase Progress ===== */
.phase-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
}
.phase-item:last-child { border-bottom: none; }
.phase-dot {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.phase-dot.p0 { background: #9e9e9e; }
.phase-dot.p1 { background: var(--blue); }
.phase-dot.p2 { background: var(--accent); }
.phase-dot.p3 { background: var(--red); }
.phase-dot.p4 { background: var(--purple); }
.phase-info { flex: 1; min-width: 0; }
.phase-name { font-size: 12px; font-weight: 600; }
.phase-meta { font-size: 10px; color: var(--text-muted); }
.phase-bar { height: 5px; background: var(--bg-warm); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.phase-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

/* ===== Log Items ===== */
.log-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-bottom: 1px solid var(--border-light);
}
.log-item:last-child { border-bottom: none; }
.log-date { font-family: var(--mono); font-size: 10px; color: var(--text-muted); flex-shrink: 0; width: 66px; }
.log-title { flex: 1; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.log-time { font-size: 11px; color: var(--text-secondary); font-weight: 600; flex-shrink: 0; }

/* ===== Subject Distribution (Overview) ===== */
.subject-chips {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
}
.subject-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 600; border: 1px solid var(--border-light);
  background: var(--bg-card);
}
.subject-chip .dot { width: 8px; height: 8px; border-radius: 50%; }

/* ===== Today's Queue Preview ===== */
.queue-preview-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border-light);
  cursor: pointer;
}
.queue-preview-item:last-child { border-bottom: none; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(44,41,37,0.4); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card); border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px; width: 100%; max-width: 640px;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.modal-item-name {
  font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 16px;
  padding: 8px 12px; background: var(--accent-light); border-radius: var(--radius-xs);
}
.modal-field { margin-bottom: 14px; }
.modal-field label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text-secondary); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.modal-mastery-btns { display: flex; gap: 8px; }
.mbtn {
  flex: 1; padding: 10px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-card);
  text-align: center; transition: all 0.15s;
}
.mbtn:hover { border-color: var(--accent); }
.mbtn.selected { border-color: var(--accent); background: var(--accent-light); }
.mbtn .emoji { font-size: 22px; display: block; margin-bottom: 2px; }
.mbtn .text { font-size: 10px; color: var(--text-secondary); font-weight: 700; }
.modal-field select, .modal-field textarea {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-xs);
  font-family: var(--font); font-size: 13px; background: var(--bg-card); color: var(--text);
}
.modal-field textarea { resize: vertical; min-height: 50px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions button {
  flex: 1; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600;
}
.modal-actions .cancel { background: var(--bg-warm); color: var(--text-secondary); }
.modal-actions .submit { background: var(--accent); color: #fff; }
.modal-actions .submit:hover { background: var(--accent-hover); }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  padding: 10px 20px; background: var(--text); color: #fff;
  border-radius: 12px; font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg); z-index: 2000;
  opacity: 0; transition: all 0.3s; max-width: 90vw; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* ===== Utils ===== */
.empty { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 13px; }
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 60vh; gap: 12px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Start Button (CTA) ===== */
.start-study-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px; margin-top: 12px;
  background: linear-gradient(135deg, var(--accent), #e8884a);
  color: #fff; border-radius: 14px; font-size: 15px; font-weight: 700;
  box-shadow: 0 4px 12px rgba(217,112,54,0.3);
  transition: all 0.2s;
}
.start-study-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217,112,54,0.4); }
.start-study-btn:active { transform: translateY(0); }

/* ===== Responsive ===== */
@media (max-width: 420px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .stat-value { font-size: 18px; }
  .timer-display { font-size: 44px; }
  .week-grid { gap: 3px; }
  .wday { padding: 6px 1px; }
  .wday-date { font-size: 14px; }
  .wday-tasks { font-size: 7px; }
  .plan-stats { flex-wrap: wrap; gap: 8px; }
}
@media (min-width: 641px) {
  .app { border-left: 1px solid var(--border-light); border-right: 1px solid var(--border-light); }
  .modal { border-radius: var(--radius); max-width: 480px; }
  .modal-overlay { align-items: center; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <div style="font-size:13px;color:var(--text-muted)">Loading from Notion...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>📝 学習完了！</h3>
    <div class="modal-item-name" id="modalItemName"></div>
    <div class="modal-field">
      <label>掌握度</label>
      <div class="modal-mastery-btns" id="modalMastery">
        <button class="mbtn" data-value="🟢 掌握" onclick="selectMastery(this)"><span class="emoji">🟢</span><span class="text">掌握</span></button>
        <button class="mbtn" data-value="🟡 半熟" onclick="selectMastery(this)"><span class="emoji">🟡</span><span class="text">半熟</span></button>
        <button class="mbtn" data-value="🔴 不会" onclick="selectMastery(this)"><span class="emoji">🔴</span><span class="text">不会</span></button>
      </div>
    </div>
    <div class="modal-field">
      <label>方法</label>
      <select id="modalMethod">
        <option value="✍️ 做题">✍️ 做题</option>
        <option value="📖 通读">📖 通读</option>
        <option value="🧠 回忆">🧠 回忆</option>
        <option value="📝 笔记">📝 笔记</option>
        <option value="🃏 Anki">🃏 Anki</option>
      </select>
    </div>
    <div class="modal-field">
      <label>备注</label>
      <textarea id="modalNotes" placeholder="记录你的想法..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">取消</button>
      <button class="submit" onclick="submitReview()">✓ 提交</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== State =====
let DATA = null;
let currentTab = 0;
let timer = { running: false, seconds: 0, interval: null, subject: 'CS', selectedItem: null, startTime: null, completedItems: new Set() };
let reviewFilter = 'all';
let selectedMastery = null;

const API = '/api/notion';
const SUBS = [
  { key: 'CS', icon: '💻', color: '#b8700f' },
  { key: 'AI', icon: '🤖', color: '#2d8055' },
  { key: 'HCI', icon: '👥', color: '#b83b36' },
  { key: 'SE', icon: '⚙️', color: '#6b4fa0' },
  { key: 'IR', icon: '🔍', color: '#3567b8' },
];
const WEEK_PLAN = {
  1: ['💻 CS基础', '🤖 AI知識'],
  2: ['👥 HCI過去問', '⚙️ SE知識'],
  3: ['💻 CS過去問', '🔍 IR知識'],
  4: ['🤖 AI過去問', '👥 HCI知識'],
  5: ['⚙️ SE過去問', '💻 CS弱点'],
  6: ['📝 全科過去問', '🔧 弱点'],
  0: ['📖 自由復習', '📓 整理'],
};

// ★ Google Calendar embed URL — replace with yours!
const GCAL_URL = '';

// ===== Helpers =====
function getPri(str) {
  if (!str) return { label: '', cls: '' };
  const m = str.match(/[SABC]/);
  return m ? { label: m[0], cls: m[0] } : { label: '', cls: '' };
}

function getCompletedCount() {
  if (!DATA || !DATA.dailyPlan) return 0;
  const serverCompleted = new Set(DATA.todayCompletedIds || []);
  let count = 0;
  DATA.dailyPlan.plan.forEach(item => {
    if (timer.completedItems.has(item.id) || serverCompleted.has(item.id)) count++;
  });
  return count;
}

function isItemCompleted(id) {
  const serverCompleted = new Set(DATA.todayCompletedIds || []);
  return timer.completedItems.has(id) || serverCompleted.has(id);
}

// ===== Init =====
async function init() {
  try {
    const r = await fetch(`${API}?action=getAll`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    DATA = await r.json();
    renderApp();
  } catch (e) {
    document.getElementById('loadingScreen').innerHTML = `
      <div style="text-align:center;color:var(--red)">
        <div style="font-size:28px;margin-bottom:8px">⚠️</div>
        <div style="font-size:14px;font-weight:600">読み込み失敗</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${e.message}</div>
        <button onclick="location.reload()" style="margin-top:14px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);font-weight:600">再試行</button>
      </div>`;
  }
}

// ===== Main Render =====
function renderApp() {
  const d = DATA;
  const tabs = [
    { icon: '📊', label: 'Overview' },
    { icon: '📋', label: 'Study' },
    { icon: '📅', label: 'Schedule' },
    { icon: '📈', label: 'Progress' },
  ];
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-top">
        <div class="header-title">🎯 京大社情</div>
        <div class="countdown-pill"><span class="days">${d.daysLeft}</span><span>days left</span></div>
      </div>
      <div class="tab-bar" id="tabBar">
        ${tabs.map((t, i) => `
          <button class="tab-btn ${i === currentTab ? 'active' : ''}" onclick="switchTab(${i})">
            <span class="tab-icon">${t.icon}</span><span>${t.label}</span>
          </button>`).join('')}
        <div class="tab-indicator" id="tabInd"></div>
      </div>
    </div>
    <div class="page ${currentTab === 0 ? 'active' : ''}">${renderOverview(d)}</div>
    <div class="page ${currentTab === 1 ? 'active' : ''}">${renderStudy(d)}</div>
    <div class="page ${currentTab === 2 ? 'active' : ''}">${renderSchedule(d)}</div>
    <div class="page ${currentTab === 3 ? 'active' : ''}">${renderProgress(d)}</div>
  `;
  updateIndicator();
  updateTimerDisplay();
}

function switchTab(i) {
  currentTab = i;
  document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
  document.querySelectorAll('.page').forEach((p, idx) => p.classList.toggle('active', idx === i));
  updateIndicator();
}
function updateIndicator() {
  const bar = document.getElementById('tabBar');
  const ind = document.getElementById('tabInd');
  if (!bar || !ind) return;
  const btn = bar.querySelectorAll('.tab-btn')[currentTab];
  if (btn) { ind.style.left = btn.offsetLeft + 'px'; ind.style.width = btn.offsetWidth + 'px'; }
}

// ===== TAB 1: Overview =====
function renderOverview(d) {
  const studied = d.masteryStats.green + d.masteryStats.yellow + d.masteryStats.red;
  const plan = d.dailyPlan || { plan: [], reviewCount: 0, newCount: 0, totalCount: 0, estimatedMinutes: 0 };
  const completed = getCompletedCount();
  const total = plan.totalCount;
  const pct = total > 0 ? Math.round(completed / total * 100) : 0;

  return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-emoji">🔥</div><div class="stat-value">${d.streak}</div><div class="stat-label">連続日数</div></div>
      <div class="stat-card"><div class="stat-emoji">⏱</div><div class="stat-value">${d.totalHours}<span class="unit">h</span></div><div class="stat-label">累計時間</div></div>
      <div class="stat-card"><div class="stat-emoji">📚</div><div class="stat-value">${studied}<span class="unit">/${d.masteryStats.total}</span></div><div class="stat-label">学習済</div></div>
      <div class="stat-card"><div class="stat-emoji">✅</div><div class="stat-value">${completed}<span class="unit">/${total}</span></div><div class="stat-label">今日完了</div></div>
    </div>
    ${renderDailyPlanSummary(d, plan, completed)}
    ${renderHeatmap(d)}
    ${renderMastery(d)}
    ${renderQuickDue(d, plan)}`;
}

function renderDailyPlanSummary(d, plan, completed) {
  const total = plan.totalCount;
  const pct = total > 0 ? Math.round(completed / total * 100) : 0;
  const circumference = 2 * Math.PI * 18;
  const dashoffset = circumference - (pct / 100 * circumference);

  return `<div class="plan-summary">
    <div class="plan-header">
      <div class="plan-title">📋 今日の学習プラン</div>
      <div class="plan-meta">${plan.isWeekend ? '週末モード' : '平日モード'}</div>
    </div>
    <div class="plan-stats">
      <div class="plan-stat new-stat"><div><div class="num">${plan.newCount}</div><div class="lbl">新規学習</div></div></div>
      <div class="plan-stat review-stat"><div><div class="num">${plan.reviewCount}</div><div class="lbl">復習</div></div></div>
      <div class="plan-stat time-stat"><div><div class="num">~${plan.estimatedMinutes}</div><div class="lbl">推定(分)</div></div></div>
    </div>
    <div class="plan-progress">
      <svg class="progress-ring" viewBox="0 0 44 44">
        <circle class="bg" cx="22" cy="22" r="18"/>
        <circle class="fg" cx="22" cy="22" r="18"
          stroke-dasharray="${circumference}"
          stroke-dashoffset="${dashoffset}"
          transform="rotate(-90 22 22)"/>
      </svg>
      <div class="plan-progress-text">
        <div class="big">${pct}% 完了</div>
        <div class="small">${completed}/${total} タスク · 残り${plan.unstudiedRemaining || 0}題未割当</div>
      </div>
    </div>
    ${total > 0 ? `<button class="start-study-btn" onclick="switchTab(1)">▶ 学習を始める</button>` : ''}
  </div>`;
}

function renderHeatmap(d) {
  const today = new Date(d.today + 'T00:00:00');
  const weeks = 22;
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks * 7) + (7 - start.getDay()));
  let html = '';
  let cur = new Date(start);
  for (let w = 0; w < weeks; w++) {
    let wk = '';
    for (let dy = 0; dy < 7; dy++) {
      const ds = cur.toISOString().split('T')[0];
      const min = d.heatmap[ds] || 0;
      const lv = min === 0 ? '' : min < 30 ? 'l1' : min < 60 ? 'l2' : min < 120 ? 'l3' : 'l4';
      const t = ds === d.today ? 'today' : '';
      const f = cur > today;
      wk += `<div class="hm ${lv} ${t} ${f ? 'future' : ''}" ${f ? '' : `data-tip="${ds}: ${min}min"`}></div>`;
      cur.setDate(cur.getDate() + 1);
    }
    html += `<div class="heatmap-week">${wk}</div>`;
  }
  return `
    <div class="card">
      <div class="card-header"><div class="card-title"><span class="icon">📊</span> ヒートマップ</div><div class="card-badge">~5ヶ月</div></div>
      <div class="card-body">
        <div class="heatmap-scroll"><div class="heatmap-grid">
          <div class="heatmap-days"><span></span><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span></div>
          ${html}
        </div></div>
        <div class="heatmap-legend">
          <span>Less</span>
          <div class="box" style="background:var(--bg-warm)"></div>
          <div class="box" style="background:#e2d7c6"></div>
          <div class="box" style="background:#f0c06e"></div>
          <div class="box" style="background:#e29840"></div>
          <div class="box" style="background:var(--accent)"></div>
          <span>More</span>
        </div>
      </div>
    </div>`;
}

function renderMastery(d) {
  const subs = Object.entries(d.subjectStats).filter(([k]) => k).sort((a, b) => b[1].total - a[1].total);
  const rows = subs.map(([name, s]) => {
    const t = s.total || 1;
    return `<div class="mastery-row">
      <div class="mastery-info"><span class="mastery-name">${name}</span><span class="mastery-counts">🟢${s.green} 🟡${s.yellow} 🔴${s.red} ⚪${s.notStudied}</span></div>
      <div class="mastery-bar"><div class="g" style="width:${(s.green/t*100).toFixed(1)}%"></div><div class="y" style="width:${(s.yellow/t*100).toFixed(1)}%"></div><div class="r" style="width:${(s.red/t*100).toFixed(1)}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">🎯</span> Mastery</div></div><div class="card-body">${rows || '<div class="empty">No data</div>'}</div></div>`;
}

function renderQuickDue(d, plan) {
  const items = plan.plan.slice(0, 5);
  if (!items.length) return '';
  const rows = items.map(item => {
    const p = getPri(item.priority);
    const done = isItemCompleted(item.id);
    const typeTag = item.queueType === 'new'
      ? '<span class="qi-type-tag new">NEW</span>'
      : '<span class="qi-type-tag review">復習</span>';
    return `<div class="queue-preview-item ${done ? 'completed' : ''}" onclick="switchTab(1)" style="${done ? 'opacity:0.4' : ''}">
      ${typeTag}
      <span class="qi-sub ${item.subject}">${item.subject}</span>
      <span class="qi-name">${item.name || '(untitled)'}</span>
      ${p.label ? `<span class="qi-pri ${p.cls}">${p.label}</span>` : ''}
      <span style="font-size:13px;flex-shrink:0">${done ? '✅' : (item.mastery || '⚪')}</span>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-header"><div class="card-title"><span class="icon">📋</span> 今日のタスク</div>
      <button class="card-badge" onclick="switchTab(1)" style="cursor:pointer;border:none;font-family:var(--font)">全て見る →</button>
    </div><div class="card-body" style="padding-top:0">${rows}</div></div>`;
}

// ===== TAB 2: Study (was "Review") =====
function renderStudy(d) {
  const plan = d.dailyPlan || { plan: [], reviewCount: 0, newCount: 0, totalCount: 0 };

  const subBtns = SUBS.map(s => `<button class="tsub ${timer.subject === s.key ? 'active' : ''}" onclick="setSubject('${s.key}')">${s.icon} ${s.key}</button>`).join('');
  const activeHtml = timer.selectedItem
    ? `<div class="timer-active"><div class="lbl">学習中</div><div class="name">${timer.selectedItem.subject ? timer.selectedItem.subject + ' · ' : ''}${timer.selectedItem.name}</div></div>`
    : `<div class="timer-active empty"><div class="lbl">項目を選択</div><div class="name">下のリストから1つ選んでスタート</div></div>`;

  // Filter buttons: all + subjects + new/review type
  const filterBtns = [
    `<button class="qf ${reviewFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</button>`,
    `<button class="qf ${reviewFilter === 'new' ? 'active' : ''}" onclick="setFilter('new')" style="${reviewFilter === 'new' ? 'background:var(--blue-light);border-color:var(--blue);color:var(--blue)' : ''}">🆕 新規</button>`,
    `<button class="qf ${reviewFilter === 'review' ? 'active' : ''}" onclick="setFilter('review')" style="${reviewFilter === 'review' ? 'background:var(--accent-light);border-color:var(--accent);color:var(--accent)' : ''}">🔄 復習</button>`,
    ...SUBS.map(s => `<button class="qf ${reviewFilter === s.key ? 'active' : ''}" onclick="setFilter('${s.key}')">${s.key}</button>`)
  ].join('');

  // Filter the plan items
  let filtered = plan.plan;
  if (reviewFilter === 'new') {
    filtered = filtered.filter(i => i.queueType === 'new');
  } else if (reviewFilter === 'review') {
    filtered = filtered.filter(i => i.queueType === 'review');
  } else if (reviewFilter !== 'all') {
    filtered = filtered.filter(i => i.subject === reviewFilter);
  }

  // Build queue HTML with section dividers
  let queueHtml = '';
  if (filtered.length === 0) {
    queueHtml = `<div class="empty">
      ${plan.totalCount === 0
        ? '📭 Notionにまだ学習項目がありません。<br>データベースに問題を追加してください。'
        : '🎉 このフィルタに該当するタスクはありません'}
    </div>`;
  } else {
    // Group by type
    const reviewItems = filtered.filter(i => i.queueType === 'review');
    const newItems = filtered.filter(i => i.queueType === 'new');

    if (reviewFilter === 'all' || reviewFilter === 'review' || SUBS.some(s => s.key === reviewFilter)) {
      if (reviewItems.length > 0) {
        queueHtml += `<div class="queue-section review-section">🔄 復習 (${reviewItems.length})<div class="line"></div></div>`;
        queueHtml += reviewItems.map(item => renderQueueItem(item)).join('');
      }
    }
    if (reviewFilter === 'all' || reviewFilter === 'new' || SUBS.some(s => s.key === reviewFilter)) {
      if (newItems.length > 0) {
        queueHtml += `<div class="queue-section new-section">🆕 新規学習 (${newItems.length})<div class="line"></div></div>`;
        queueHtml += newItems.map(item => renderQueueItem(item)).join('');
      }
    }
  }

  // Completed count
  const completed = getCompletedCount();

  return `
    <div class="timer-card">
      <div class="timer-subjects">${subBtns}</div>
      <div class="timer-display ${timer.running ? 'running' : ''}" id="timerDisplay">${fmtTime(timer.seconds)}</div>
      <div class="timer-controls">
        ${timer.running ? `<button class="tbtn stop" onclick="stopTimer()">⏹ 停止</button>` : `<button class="tbtn start" onclick="startTimer()">▶ 開始</button>`}
        <button class="tbtn reset" onclick="resetTimer()">↻</button>
      </div>
      ${activeHtml}
    </div>
    <div class="card" style="overflow:visible">
      <div class="card-header">
        <div class="card-title"><span class="icon">📋</span> 学習キュー</div>
        <div class="card-badge">${completed}/${plan.totalCount} 完了</div>
      </div>
      <div class="queue-filters">${filterBtns}</div>
      <div class="queue-list">${queueHtml}</div>
    </div>`;
}

function renderQueueItem(item) {
  const p = getPri(item.priority);
  const sel = timer.selectedItem?.id === item.id;
  const done = isItemCompleted(item.id);
  const typeTag = item.queueType === 'new'
    ? '<span class="qi-type-tag new">NEW</span>'
    : '<span class="qi-type-tag review">復習</span>';

  return `<div class="qi ${sel ? 'selected' : ''} ${done ? 'completed' : ''}" data-id="${item.id}" onclick="selectItem('${item.id}')">
    <div class="qi-check">${done ? '✓' : ''}</div>
    ${typeTag}
    <span class="qi-sub ${item.subject}">${item.subject || '?'}</span>
    <span class="qi-name" title="${item.name}">${item.name || '(untitled)'}</span>
    ${p.label ? `<span class="qi-pri ${p.cls}">${p.label}</span>` : ''}
    <span class="qi-mastery">${item.mastery || '⚪'}</span>
    ${!done ? `<button class="qi-done-btn" onclick="event.stopPropagation();quickComplete('${item.id}')">完了</button>` : ''}
  </div>`;
}

// ===== TAB 3: Schedule =====
function renderSchedule(d) {
  const plan = d.dailyPlan || { plan: [] };
  const calHtml = GCAL_URL
    ? `<div class="gcal-embed"><iframe src="${GCAL_URL}" frameborder="0" scrolling="no"></iframe></div>`
    : `<div class="gcal-embed"><div class="gcal-setup">
        <h3>📅 Google Calendar 連携</h3>
        <p>Google Calendar を埋め込んで、学習スケジュールを表示できます。</p>
        <div class="steps"><ol>
          <li>Google Calendar → ⚙️ 設定を開く</li>
          <li>対象カレンダー → 「カレンダーの統合」</li>
          <li>「このカレンダーの公開URL」をコピー</li>
          <li>index.html の <code>GCAL_URL</code> に貼り付け</li>
        </ol></div>
        <p style="margin-top:10px;font-size:11px;color:var(--text-muted)">
          形式例: <code>https://calendar.google.com/calendar/embed?src=YOUR_ID&ctz=Asia/Tokyo</code>
        </p>
      </div></div>`;
  return `${renderSmartRec(d)}${calHtml}${renderWeekPlan()}`;
}

function renderSmartRec(d) {
  const now = new Date();
  const dow = now.getDay();
  const isWE = dow === 0 || dow === 6;
  const plan = d.dailyPlan || { plan: [] };

  // Build schedule from actual plan items
  const sched = [];
  const reviewItems = plan.plan.filter(i => i.queueType === 'review');
  const newItems = plan.plan.filter(i => i.queueType === 'new');

  if (isWE) {
    sched.push({ time: '9:00', label: '📖 今日の復習タスク開始', count: reviewItems.length });
    if (reviewItems.length > 0) {
      reviewItems.slice(0, 3).forEach((item, i) => {
        const mins = 15 + i * 5;
        const h = 9 + Math.floor((30 + i * 20) / 60);
        const m = (30 + i * 20) % 60;
        sched.push({ time: `${h}:${String(m).padStart(2,'0')}`, label: item.name, sub: item.subject });
      });
    }
    sched.push({ time: '11:00', label: '🆕 新規学習', count: newItems.length });
    newItems.slice(0, 3).forEach((item, i) => {
      const h = 11 + Math.floor((30 + i * 25) / 60);
      const m = (30 + i * 25) % 60;
      sched.push({ time: `${h}:${String(m).padStart(2,'0')}`, label: item.name, sub: item.subject });
    });
    sched.push({ time: '14:00', label: '📝 ノート整理 + Notion打卡' });
    sched.push({ time: '16:00', label: '🔧 弱点復習 + 自由学習' });
  } else {
    sched.push({ time: '7:00', label: '📖 通勤学習 (復習2-3題)' });
    sched.push({ time: '12:00', label: '🔄 昼休み復習 (15min)' });
    sched.push({ time: '19:30', label: '📚 集中学習タイム' });
    if (plan.plan.length > 0) {
      plan.plan.slice(0, 3).forEach((item, i) => {
        const m = i * 20;
        sched.push({ time: `${19 + Math.floor((50 + m) / 60)}:${String((50 + m) % 60).padStart(2,'0')}`, label: item.name, sub: item.subject });
      });
    }
    sched.push({ time: '21:30', label: '📝 Notion打卡 + 振り返り' });
  }

  return `<div class="rec-card">
    <div class="rec-title">🧠 今日のタイムライン (${isWE ? '週末' : '平日'})</div>
    ${sched.map(s => `<div class="rec-item">
      <span class="rec-time">${s.time}</span>
      <span class="rec-label">${s.label}${s.count != null ? ` (${s.count}題)` : ''}</span>
      ${s.sub ? `<span class="qi-sub ${s.sub}" style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px">${s.sub}</span>` : ''}
    </div>`).join('')}
    <div style="margin-top:10px;font-size:10px;color:var(--text-muted);text-align:center">
      合計${plan.totalCount || 0}題 · 推定${plan.estimatedMinutes || 0}分
    </div>
  </div>`;
}

function renderWeekPlan() {
  const today = new Date();
  const mon = new Date(today);
  mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const isT = d.toDateString() === today.toDateString();
    const tasks = WEEK_PLAN[d.getDay()] || [];
    html += `<div class="wday ${isT ? 'today' : ''}">
      <div class="wday-label">${names[i]}</div><div class="wday-date">${d.getDate()}</div>
      <div class="wday-tasks">${tasks.join('<br>')}</div>
    </div>`;
  }
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📅</span> 週間計画</div></div>
    <div class="card-body"><div class="week-grid">${html}</div></div></div>`;
}

// ===== TAB 4: Progress =====
function renderProgress(d) {
  return `${renderMastery(d)}${renderPhases(d)}${renderLogs(d)}`;
}

function renderPhases(d) {
  const phases = [
    { key: 'Phase 0 热身', name: 'P0 热身', cls: 'p0', color: '#9e9e9e', target: 7 },
    { key: 'Phase 1 基础', name: 'P1 基礎', cls: 'p1', color: 'var(--blue)', target: 60 },
    { key: 'Phase 2 过去问', name: 'P2 過去問', cls: 'p2', color: 'var(--accent)', target: 60 },
    { key: 'Phase 3 弱点攻克', name: 'P3 弱点攻克', cls: 'p3', color: 'var(--red)', target: 30 },
    { key: 'Phase 4 冲刺', name: 'P4 衝刺', cls: 'p4', color: 'var(--purple)', target: 14 },
  ];
  const rows = phases.map(p => {
    const data = d.phaseItems[p.key] || { count: 0, totalMinutes: 0 };
    const pct = Math.min(100, data.count / p.target * 100).toFixed(0);
    return `<div class="phase-item">
      <div class="phase-dot ${p.cls}">${p.cls.charAt(1)}</div>
      <div class="phase-info">
        <div class="phase-name">${p.name}</div>
        <div class="phase-meta">${data.count}日/${p.target}日 · ${Math.round(data.totalMinutes/60)}h</div>
        <div class="phase-bar"><div class="phase-fill" style="width:${pct}%;background:${p.color}"></div></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">🎯</span> Phase Progress</div></div>
    <div class="card-body">${rows}</div></div>`;
}

function renderLogs(d) {
  const items = d.logs.slice(0, 10).map(l =>
    `<div class="log-item"><span class="log-date">${l.reviewDate || '—'}</span><span class="log-title">${l.title}</span><span class="log-time">${l.timeSpent}min ${l.mastery || ''}</span></div>`
  ).join('');
  return `<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📝</span> 学習記録</div></div>
    <div class="card-body">${items || '<div class="empty">まだ記録がありません。<br>学習を始めて記録を作りましょう！</div>'}</div></div>`;
}

// ===== Timer =====
function fmtTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function setSubject(s) { timer.subject = s; renderApp(); }
function startTimer() {
  if (timer.running) return;
  timer.running = true; timer.startTime = new Date().toISOString();
  timer.interval = setInterval(() => { timer.seconds++; updateTimerDisplay(); }, 1000);
  renderApp();
}
function stopTimer() {
  if (!timer.running) return;
  clearInterval(timer.interval); timer.running = false;
  const min = Math.round(timer.seconds / 60);
  if (timer.selectedItem && min >= 1) showModal(timer.selectedItem, min);
  else if (min >= 1) showToast(`${min}分の学習を記録`, 'success');
  renderApp();
}
function resetTimer() {
  clearInterval(timer.interval);
  timer.running = false; timer.seconds = 0; timer.selectedItem = null; timer.startTime = null;
  renderApp();
}
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = fmtTime(timer.seconds);
}
function selectItem(id) {
  if (isItemCompleted(id)) return;
  const plan = DATA.dailyPlan?.plan || [];
  const item = plan.find(i => i.id === id) || DATA.dueToday.find(i => i.id === id);
  if (item) { timer.selectedItem = item; if (item.subject) timer.subject = item.subject; renderApp(); }
}
function setFilter(f) { reviewFilter = f; renderApp(); }
function quickComplete(id) {
  const plan = DATA.dailyPlan?.plan || [];
  const item = plan.find(i => i.id === id) || DATA.dueToday.find(i => i.id === id);
  if (item) { timer.selectedItem = item; if (item.subject) timer.subject = item.subject; showModal(item, 0); }
}

// ===== Modal =====
function showModal(item, minutes) {
  selectedMastery = null;
  document.getElementById('modalItemName').textContent = `${item.subject ? item.subject + ' · ' : ''}${item.name}`;
  document.getElementById('modalNotes').value = '';
  document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('selected'));
  document.getElementById('reviewModal').classList.add('show');
  window._rd = { item, minutes };
}
function closeModal() { document.getElementById('reviewModal').classList.remove('show'); }
function selectMastery(btn) {
  document.querySelectorAll('.mbtn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMastery = btn.dataset.value;
}
async function submitReview() {
  if (!selectedMastery) { showToast('掌握度を選んでください', 'error'); return; }
  const { item, minutes } = window._rd;
  closeModal(); showToast('記録中...', '');
  try {
    await fetch(`${API}?action=complete-review`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studyItemId: item.id, studyItemName: item.name, subject: item.subject,
        timeSpent: minutes || 1, mastery: selectedMastery,
        method: document.getElementById('modalMethod').value,
        notes: document.getElementById('modalNotes').value,
        startTime: timer.startTime, endTime: new Date().toISOString(),
      }),
    });
    timer.completedItems.add(item.id);
    timer.seconds = 0; timer.selectedItem = null; timer.startTime = null;
    showToast(`✓ ${item.name} 記録完了！`, 'success');
    setTimeout(async () => { const r = await fetch(`${API}?action=getAll`); DATA = await r.json(); renderApp(); }, 1500);
  } catch (e) { showToast('失敗: ' + e.message, 'error'); }
}

// ===== Toast =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type || '');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== Resize =====
window.addEventListener('resize', updateIndicator);

// ===== Go! =====
init();
</script>
</body>

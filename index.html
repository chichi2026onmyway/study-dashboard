<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>京大社情 Study Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f4f0;font-family:'Noto Sans JP','Noto Sans SC',-apple-system,sans-serif;color:#333;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border-radius:16px;padding:20px 22px;border:1px solid #e8e6e0}
  .card-title{font-size:12px;color:#999;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;margin-bottom:14px}
  .btn{border:none;border-radius:10px;padding:13px 0;font-size:15px;font-weight:600;cursor:pointer;width:100%;letter-spacing:1px;transition:opacity .2s}
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stat-box{text-align:center;padding:10px 6px;background:#f8f8f5;border-radius:9px}
  .stat-label{font-size:10px;color:#999}
  .stat-value{font-size:18px;font-weight:700;color:#1a1a2e}
  .stat-sub{font-size:9px;color:#aaa}
  input[type=text]{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 13px;color:#ccd6f6;font-size:12px;outline:none;font-family:inherit}
  input[type=text]::placeholder{color:#4a5072}
  .progress-bar{height:8px;background:#f0f0f0;border-radius:4px;display:flex;overflow:hidden}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;animation:toast-in .3s ease}
  @keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .scroll-thin::-webkit-scrollbar{width:4px}
  .scroll-thin::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── CONFIG ───
const API = "/api/notion";
const EXAM = new Date("2026-08-10");
const SUBJECTS = [
  { id:"CS", name:"CS 情報学基礎", color:"#D4A017", accent:"#FFF8E1", icon:"💻" },
  { id:"AI", name:"AI 人工知能",   color:"#3B7DD8", accent:"#E3F2FD", icon:"🤖" },
  { id:"HCI",name:"HCI 人机交互",  color:"#43A047", accent:"#E8F5E9", icon:"🖱️" },
  { id:"SE", name:"SE 软件工程",   color:"#D81B60", accent:"#FCE4EC", icon:"⚙️" },
  { id:"IR", name:"IR 情報検索",   color:"#E64A19", accent:"#FBE9E7", icon:"🔍" },
];
const PHASES = [
  { name:"Phase 1: 基础扫盲", start:"2026-02-19", end:"2026-04-15", desc:"通读教材 + S级知识点", color:"#3B7DD8" },
  { name:"Phase 2: 过去问攻略", start:"2026-04-16", end:"2026-06-15", desc:"全部过去问至少做一遍", color:"#43A047" },
  { name:"Phase 3: 弱点强化", start:"2026-06-16", end:"2026-07-20", desc:"🔴🟡重做 + 模拟练习", color:"#E64A19" },
  { name:"Phase 4: 冲刺", start:"2026-07-21", end:"2026-08-10", desc:"限时模拟 + 最终回顾", color:"#D81B60" },
];
const WEEKLY = [
  {day:"Mon",label:"周一",sub:"CS",focus:"Ch1-4 基础概念",min:45,method:"📖 通读→✍️做题"},
  {day:"Tue",label:"周二",sub:"AI",focus:"过去问+知识点",min:45,method:"✍️ 做题"},
  {day:"Wed",label:"周三",sub:"HCI",focus:"实验设计/应用",min:45,method:"✍️ 做题+📝笔记"},
  {day:"Thu",label:"周四",sub:"SE",focus:"测试/设计模式/UML",min:45,method:"✍️ 做题"},
  {day:"Fri",label:"周五",sub:"CS",focus:"Ch5-8 算法/数据",min:45,method:"✍️ 做题"},
  {day:"Sat",label:"周六",sub:"IR",focus:"过去问集中+复盘",min:120,method:"模拟"},
  {day:"Sun",label:"周日",sub:"CS",focus:"Ch9-12+弱点补强",min:120,method:"综合复习"},
];

const today = () => new Date().toISOString().split("T")[0];
const daysLeft = () => Math.ceil((EXAM - new Date()) / 864e5);
const curPhase = () => {
  const t = new Date(today());
  return PHASES.find(p => t >= new Date(p.start) && t <= new Date(p.end)) || PHASES[0];
};
const fmtTime = (s) => {
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h > 0
    ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
};

async function api(action, body) {
  try {
    const r = await fetch(`${API}?action=${action}`, {
      method: body ? "POST" : "GET",
      headers: body ? {"Content-Type":"application/json"} : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  } catch(e) {
    console.error("API error:", e);
    return null;
  }
}

// ─── COUNTDOWN BANNER ───
function Countdown({ phase }) {
  const d = daysLeft();
  const urg = d<=30?"#C62828":d<=90?"#E65100":"#1a1a2e";
  return (
    <div style={{background:`linear-gradient(135deg,${urg},${urg}dd)`,borderRadius:18,padding:"18px 24px",color:"#fff",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
      <div>
        <div className="mono" style={{fontSize:11,opacity:.65,letterSpacing:2,textTransform:"uppercase"}}>京都大学 社会情報学 2026.8 入試</div>
        <div style={{fontSize:12,opacity:.45,marginTop:4}}>{phase?.name} — {phase?.desc}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div className="mono" style={{fontSize:48,fontWeight:800,lineHeight:1}}>{d}</div>
        <div style={{fontSize:11,opacity:.6}}>days left</div>
      </div>
    </div>
  );
}

// ─── MOTIVATIONAL BLOCK ───
function Motiv({ logData, checkins }) {
  const totalH = Math.round(((checkins||[]).reduce((s,c)=>s+(c.minutes||0),0) + (logData||[]).reduce((s,l)=>s+(l.minutes||0),0)) / 60);
  const quotes = ["一日一歩、千里の道も","継続は力なり","今日の一問が、合格への一歩","努力は裏切らない","京大で待ってるよ","できると信じれば、半分は達成したも同然"];
  const q = quotes[new Date().getDate() % quotes.length];
  return (
    <div style={{background:"linear-gradient(135deg,#fdfcfb,#e8ddd0)",borderRadius:16,padding:"16px 22px",border:"1px solid #e0d5c9",textAlign:"center",marginTop:14}}>
      <div style={{fontSize:16,fontWeight:300,color:"#5D4E37",fontStyle:"italic",letterSpacing:1}}>「{q}」</div>
      <div style={{fontSize:11,color:"#A08B6F",marginTop:8}}>累计约 <b>{totalH}</b> 小时 · 距考试 <b>{daysLeft()}</b> 天</div>
    </div>
  );
}

// ─── STUDY TIMER ───
function Timer({ onLog }) {
  const [run, setRun] = useState(false);
  const [sec, setSec] = useState(0);
  const [subj, setSubj] = useState("CS");
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [result, setResult] = useState(null);
  const startRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (run) {
      intervalRef.current = setInterval(() => setSec(s => s + 1), 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [run]);

  // Keep screen awake while timer is running
  useEffect(() => {
    let wakeLock = null;
    if (run && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(wl => { wakeLock = wl; }).catch(() => {});
    }
    return () => { wakeLock?.release(); };
  }, [run]);

  const go = () => {
    setRun(true);
    startRef.current = new Date();
    setSec(0);
    setResult(null);
  };

  const stop = async () => {
    setRun(false);
    const mins = Math.max(1, Math.round(sec / 60));
    setSaving(true);
    setResult(null);
    const r = await api("create-log", {
      title: `${subj} 复习 ${today()} - ${note || "日常复习"}`,
      date: today(),
      minutes: mins,
      method: "✍️ 做题",
      startTime: startRef.current?.toISOString(),
      endTime: new Date().toISOString(),
    });
    setSaving(false);
    if (r?.success) {
      setResult({ ok: true, minutes: mins });
      onLog?.({ subject: subj, minutes: mins, date: today(), note });
    } else {
      setResult({ ok: false });
    }
    setNote("");
  };

  const reset = () => { setRun(false); setSec(0); setResult(null); };
  const sub = SUBJECTS.find(s => s.id === subj);
  const pct = Math.min((sec / (45 * 60)) * 100, 100);
  const isOvertime = sec > 45 * 60;

  return (
    <div style={{background:"linear-gradient(135deg,#13111a 0%,#1a1833 50%,#0d1b3e 100%)",borderRadius:18,padding:"24px 26px",color:"#fff",position:"relative",overflow:"hidden"}}>
      {/* Progress bar at top */}
      <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"#222"}}>
        <div style={{height:"100%",width:`${pct}%`,background:isOvertime?"#C62828":sub?.color,transition:"width 1s linear",borderRadius:"18px 0 0 0"}} />
      </div>

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <span className="mono" style={{fontSize:11,color:"#6b7094",letterSpacing:2,textTransform:"uppercase"}}>⏱ Study Timer</span>
        <span className="mono" style={{fontSize:11,color:"#4a5072",background:"rgba(255,255,255,.04)",borderRadius:8,padding:"3px 10px"}}>
          {isOvertime ? "🔥 加时中!" : "目标 45min"}
        </span>
      </div>

      {/* Time Display */}
      <div className="mono" style={{
        fontSize:60,fontWeight:200,textAlign:"center",letterSpacing:6,
        color:run?"#e6f1ff":"#4a5072",
        textShadow:run?`0 0 80px ${sub?.color}40, 0 0 30px ${sub?.color}20`:"none",
        margin:"4px 0 18px",transition:"all .3s",
      }}>
        {fmtTime(sec)}
      </div>

      {/* Subject Pills */}
      <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
        {SUBJECTS.map(s => (
          <button key={s.id} onClick={() => !run && setSubj(s.id)} style={{
            background:subj===s.id?s.color:"rgba(255,255,255,.05)",
            color:subj===s.id?"#fff":"#6b7094",
            border:"none",borderRadius:7,padding:"6px 14px",fontSize:12,
            cursor:run?"not-allowed":"pointer",
            opacity:run && subj!==s.id?.2:1,
            fontWeight:subj===s.id?600:400,transition:"all .2s",
          }}>{s.icon} {s.id}</button>
        ))}
      </div>

      {/* Note Input */}
      {!run && (
        <input type="text" placeholder="复习内容 (如: 2024.8 CS Q1)" value={note}
          onChange={e => setNote(e.target.value)}
          style={{marginBottom:12}} />
      )}

      {/* Action Buttons */}
      <div style={{display:"flex",gap:8}}>
        {!run ? (
          <button onClick={go} className="btn" style={{background:sub?.color,color:"#fff"}}>
            ▶ 开始复习
          </button>
        ) : (
          <>
            <button onClick={stop} disabled={saving} className="btn" style={{background:saving?"#555":"#C62828",color:"#fff",flex:3}}>
              {saving ? "⏳ 记录到Notion..." : "⏹ 结束 → 记录到Notion"}
            </button>
            <button onClick={reset} className="btn" style={{background:"rgba(255,255,255,.08)",color:"#888",flex:1,fontSize:12}}>
              ✕ 取消
            </button>
          </>
        )}
      </div>

      {/* Result Toast */}
      {result && (
        <div style={{
          marginTop:10,padding:"8px 14px",borderRadius:8,fontSize:12,textAlign:"center",
          background:result.ok?"rgba(67,160,71,.15)":"rgba(198,40,40,.15)",
          color:result.ok?"#81C784":"#EF9A9A",
        }}>
          {result.ok ? `✅ 已记录到Notion! (${result.minutes}分钟)` : "⚠️ 记录失败，请手动在Notion记录"}
        </div>
      )}
    </div>
  );
}

// ─── TODAY'S PLAN ───
function TodayPlan() {
  const dayMap = {0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const todayKey = dayMap[new Date().getDay()];
  const plan = WEEKLY.find(w => w.day === todayKey);
  if (!plan) return null;
  const sub = SUBJECTS.find(s => s.id === plan.sub);
  return (
    <div style={{background:sub?.accent,borderRadius:16,padding:"18px 22px",border:`2px solid ${sub?.color}30`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:14,fontWeight:700,color:sub?.color}}>{sub?.icon} 今日: {plan.sub}</span>
        <span className="mono" style={{fontSize:12,color:"#999",background:"#fff",borderRadius:6,padding:"2px 8px"}}>{plan.min}min</span>
      </div>
      <div style={{fontSize:13,color:"#555"}}>{plan.focus}</div>
      <div style={{fontSize:11,color:"#999",marginTop:4}}>方法: {plan.method}</div>
    </div>
  );
}

// ─── TODAY'S DUE ITEMS ───
function TodayDue({ items, loading }) {
  if (loading) return <div className="card"><div className="card-title">📋 今日待复习</div><div style={{textAlign:"center",padding:30,color:"#999"}}>加载中...</div></div>;
  const list = items || [];
  return (
    <div className="card">
      <div className="card-title">📋 今日待复习 ({list.length})</div>
      {list.length === 0 ? (
        <div style={{textAlign:"center",padding:20,color:"#bbb",fontSize:13}}>
          {items ? "✅ 今日没有到期项目！" : "点击 🔄 加载数据"}
        </div>
      ) : (
        <div className="scroll-thin" style={{display:"flex",flexDirection:"column",gap:6,maxHeight:280,overflowY:"auto"}}>
          {list.map((item, i) => {
            const sub = SUBJECTS.find(s => s.id === item.subject);
            return (
              <a key={i} href={item.url} target="_blank" rel="noopener" style={{
                display:"flex",alignItems:"center",gap:10,padding:"8px 12px",
                borderRadius:8,background:sub?.accent||"#f5f5f5",
                borderLeft:`3px solid ${sub?.color||"#ccc"}`,
                textDecoration:"none",color:"inherit",transition:"opacity .2s",
              }}>
                <span style={{fontSize:14}}>{sub?.icon}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,color:"#333",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                  <div style={{fontSize:11,color:"#999"}}>{item.type} · {item.priority}</div>
                </div>
                <span style={{fontSize:16}}>{item.mastery||"⬜"}</span>
              </a>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── MASTERY PROGRESS ───
function Progress({ data, loading }) {
  if (loading) return <div className="card"><div className="card-title">📊 Mastery Progress</div><div style={{textAlign:"center",padding:30,color:"#999"}}>加载中...</div></div>;
  if (!data) return <div className="card"><div className="card-title">📊 Mastery Progress</div><div style={{textAlign:"center",padding:30,color:"#bbb"}}>点击 🔄 加载</div></div>;
  const subjects = data.bySubject || {};
  return (
    <div className="card">
      <div className="card-title">📊 Mastery Progress</div>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {SUBJECTS.map(s => {
          const d = subjects[s.id] || {total:0,green:0,yellow:0,red:0,none:0};
          const t = d.total || 1;
          return (
            <div key={s.id}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:13,fontWeight:600,color:"#333"}}>{s.icon} {s.id}</span>
                <span className="mono" style={{fontSize:11,color:"#999"}}>🟢{d.green} 🟡{d.yellow} 🔴{d.red} ⬜{d.none}</span>
              </div>
              <div className="progress-bar">
                <div style={{width:`${(d.green/t)*100}%`,background:"#66BB6A",transition:"width .5s"}} />
                <div style={{width:`${(d.yellow/t)*100}%`,background:"#FFA726",transition:"width .5s"}} />
                <div style={{width:`${(d.red/t)*100}%`,background:"#EF5350",transition:"width .5s"}} />
              </div>
            </div>
          );
        })}
      </div>
      {data.totalItems > 0 && (
        <div style={{marginTop:14,padding:"10px 14px",background:"#f8f8f5",borderRadius:10,fontSize:12,color:"#666",textAlign:"center"}}>
          共 <b>{data.totalItems}</b> 个学习项目 · 🟢 掌握 <b>{data.totalGreen||0}</b> · 完成率 <b>{Math.round(((data.totalGreen||0)/data.totalItems)*100)}%</b>
        </div>
      )}
    </div>
  );
}

// ─── CALENDAR HEATMAP ───
function Calendar({ logData, checkins }) {
  const now = new Date();
  const [mo, setMo] = useState(now.getMonth());
  const [yr, setYr] = useState(now.getFullYear());
  const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const wk = ["日","月","火","水","木","金","土"];

  const first = new Date(yr, mo, 1);
  const last = new Date(yr, mo + 1, 0);
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= last.getDate(); d++) cells.push(d);

  // Merge log data and check-in data
  const byDate = {};
  (logData || []).forEach(l => {
    if (!l.date) return;
    if (!byDate[l.date]) byDate[l.date] = {count:0, minutes:0};
    byDate[l.date].count++;
    byDate[l.date].minutes += (l.minutes || 0);
  });
  (checkins || []).forEach(c => {
    if (!c.date) return;
    if (!byDate[c.date]) byDate[c.date] = {count:0, minutes:0};
    byDate[c.date].minutes = Math.max(byDate[c.date].minutes, c.minutes || 0);
    if (c.mood) byDate[c.date].mood = c.mood;
  });

  const prev = () => { if(mo===0){setMo(11);setYr(y=>y-1);}else setMo(m=>m-1); };
  const next = () => { if(mo===11){setMo(0);setYr(y=>y+1);}else setMo(m=>m+1); };

  // Streak
  let streak = 0;
  const dd = new Date(now);
  for (let i = 0; i < 365; i++) {
    const ds = dd.toISOString().split("T")[0];
    if (byDate[ds] && byDate[ds].minutes > 0) streak++;
    else if (i > 0) break; // Allow today to be incomplete
    else break;
    dd.setDate(dd.getDate() - 1);
  }

  const moKey = `${yr}-${String(mo+1).padStart(2,"0")}`;
  const moMin = Object.entries(byDate).filter(([k]) => k.startsWith(moKey)).reduce((s,[,v]) => s+v.minutes, 0);
  const moDays = Object.entries(byDate).filter(([k]) => k.startsWith(moKey) && byDate[k].minutes > 0).length;
  const todayStr = today();
  const todayMin = byDate[todayStr]?.minutes || 0;

  return (
    <div className="card">
      <div className="card-title">📆 Study Calendar</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <button onClick={prev} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#999",padding:"4px 8px"}}>◂</button>
        <span style={{fontSize:14,fontWeight:600}}>{yr}年{months[mo]}</span>
        <button onClick={next} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#999",padding:"4px 8px"}}>▸</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,textAlign:"center"}}>
        {wk.map(w => <div key={w} style={{fontSize:10,color:"#bbb",padding:3}}>{w}</div>)}
        {cells.map((day, i) => {
          if (day === null) return <div key={`e${i}`}/>;
          const ds = `${yr}-${String(mo+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
          const info = byDate[ds];
          const isT = ds === todayStr;
          const isFuture = new Date(ds) > now;
          const intensity = info ? Math.min((info.minutes || 0) / 90, 1) : 0;
          const bg = info && info.minutes > 0
            ? `rgba(67,160,71,${0.15 + intensity * 0.65})`
            : isT ? "#1a1a2e" : "transparent";
          return (
            <div key={i} title={info ? `${info.minutes}min · ${info.count || 0}回 ${info.mood || ""}` : ""}
              style={{padding:"5px 0",borderRadius:6,fontSize:12,
                background:bg,
                color: isT ? "#fff" : info && info.minutes > 0 ? "#1B5E20" : isFuture ? "#ddd" : "#888",
                fontWeight: isT ? 700 : 400,
                cursor: info ? "help" : "default",
                position:"relative",
              }}>
              {day}
              {info && info.minutes > 0 && <div style={{fontSize:7,marginTop:1,opacity:.8}}>{info.minutes}m</div>}
            </div>
          );
        })}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginTop:14}}>
        <div className="stat-box"><div className="stat-label">今日</div><div className="stat-value">{todayMin}m</div><div className="stat-sub">{todayMin>=45?"✅ 达标":`差${Math.max(0,45-todayMin)}m`}</div></div>
        <div className="stat-box"><div className="stat-label">本月</div><div className="stat-value">{Math.round(moMin/60)}h</div><div className="stat-sub">{moDays}天/{last.getDate()}天</div></div>
        <div className="stat-box"><div className="stat-label">连续</div><div className="stat-value">{streak}天</div><div className="stat-sub">{streak>=14?"🏆":streak>=7?"🔥":streak>=3?"👍":"💪"}</div></div>
        <div className="stat-box"><div className="stat-label">总计</div><div className="stat-value">{Object.keys(byDate).filter(k=>byDate[k].minutes>0).length}</div><div className="stat-sub">学习天数</div></div>
      </div>
    </div>
  );
}

// ─── WEEKLY PLAN ───
function WeeklyPlan() {
  const dayMap = {0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const todayKey = dayMap[new Date().getDay()];
  return (
    <div className="card">
      <div className="card-title">📋 Weekly Plan</div>
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        {WEEKLY.map(p => {
          const sub = SUBJECTS.find(s => s.id === p.sub);
          const cur = p.day === todayKey;
          return (
            <div key={p.day} style={{
              display:"flex",alignItems:"center",gap:10,padding:"7px 10px",
              borderRadius:8,
              background:cur?`${sub?.color}0d`:"transparent",
              border:cur?`1.5px solid ${sub?.color}30`:"1.5px solid transparent",
            }}>
              <span className="mono" style={{width:28,fontSize:11,fontWeight:cur?800:400,color:cur?sub?.color:"#aaa"}}>{p.label}</span>
              <span style={{width:7,height:7,borderRadius:"50%",background:sub?.color,opacity:cur?1:.3,flexShrink:0}} />
              <span style={{flex:1,fontSize:12,fontWeight:cur?600:400,color:cur?"#333":"#888"}}>
                {sub?.icon} {p.sub} <span style={{color:"#bbb",fontWeight:400,marginLeft:4}}>{p.focus}</span>
              </span>
              <span className="mono" style={{fontSize:10,color:"#bbb"}}>{p.min}m</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── PHASE PROGRESS ───
function PhaseBar({ logData, checkins }) {
  const t = new Date(today());
  const phase = curPhase();
  const allDates = new Set([
    ...(logData||[]).map(l => l.date),
    ...(checkins||[]).map(c => c.date),
  ].filter(Boolean));
  return (
    <div className="card">
      <div className="card-title">🎯 Phase Progress</div>
      {PHASES.map((p, i) => {
        const s = new Date(p.start), e = new Date(p.end);
        const total = (e-s)/864e5;
        const el = Math.max(0, Math.min(total, (t-s)/864e5));
        const pct = Math.round((el/total)*100);
        const cur = p === phase, past = t > e, future = t < s;
        return (
          <div key={i} style={{
            marginBottom:12,padding:cur?"10px 12px":"6px 12px",
            background:cur?`${p.color}08`:"transparent",
            borderRadius:9,border:cur?`1px solid ${p.color}25`:"1px solid transparent",
            opacity:future?.35:1,
          }}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:12,fontWeight:cur?700:400,color:cur?p.color:"#666"}}>{cur && "▸ "}{p.name}</span>
              <span className="mono" style={{fontSize:10,color:"#aaa"}}>{past?"✅":future?`${p.start.slice(5)}~`:`${pct}%`}</span>
            </div>
            {cur && <div style={{fontSize:11,color:"#888",marginBottom:6}}>{p.desc}</div>}
            <div style={{height:3,background:"#eee",borderRadius:2}}>
              <div style={{height:"100%",width:`${past?100:pct}%`,background:past?"#ccc":p.color,borderRadius:2,transition:"width .5s"}} />
            </div>
          </div>
        );
      })}
      <div style={{fontSize:11,color:"#999",textAlign:"center",marginTop:6}}>📅 累计学习 <b>{allDates.size}</b> 天</div>
    </div>
  );
}

// ─── RECENT ACTIVITY ───
function RecentAct({ logData }) {
  const recent = (logData||[]).slice(0, 12);
  return (
    <div className="card">
      <div className="card-title">📝 最近复习记录</div>
      {recent.length === 0 ? (
        <div style={{textAlign:"center",padding:20,color:"#bbb",fontSize:13}}>暂无记录</div>
      ) : (
        <div className="scroll-thin" style={{display:"flex",flexDirection:"column",gap:5,maxHeight:260,overflowY:"auto"}}>
          {recent.map((r, i) => {
            const sub = SUBJECTS.find(s => s.id === r.subject);
            return (
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:7,background:"#fafaf7"}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:sub?.color||"#ccc",flexShrink:0}} />
                <div style={{flex:1,fontSize:12,color:"#555",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {sub?.icon||"📖"} {r.title || r.subject}
                </div>
                <span className="mono" style={{fontSize:11,color:"#aaa",flexShrink:0}}>{r.minutes||"?"}m</span>
                <span style={{fontSize:10,color:"#ccc",flexShrink:0}}>{(r.date||"").slice(5)}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── WORKFLOW TIP ───
function Tip() {
  const [open, setOpen] = useState(false);
  return (
    <div className="card">
      <div className="card-title" style={{cursor:"pointer",display:"flex",justifyContent:"space-between"}} onClick={() => setOpen(!open)}>
        <span>💡 使用说明</span>
        <span>{open ? "▾" : "▸"}</span>
      </div>
      {open && (
        <div style={{fontSize:12,color:"#666",lineHeight:2}}>
          <div>1️⃣ <b>点 ▶ 开始</b> → 选科目 → 开始计时</div>
          <div>2️⃣ <b>点 ⏹ 结束</b> → 自动记录到 Notion 復習ログ</div>
          <div>3️⃣ <b>去 Notion</b> → 补充 Mastery 和 Study Item 关联</div>
          <div>4️⃣ <b>Auto Redo</b> 自动计算下次复习日</div>
          <div style={{marginTop:8,padding:"8px 12px",background:"#FFF8E1",borderRadius:8,fontSize:11,color:"#8D6E12"}}>
            ⚡ 手动在Notion记录也OK! 填 Start/End Time → Duration 自动算
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════ MAIN APP ═══════════════
function App() {
  const [studyData, setStudyData] = useState(null);
  const [dueItems, setDueItems] = useState(null);
  const [logData, setLogData] = useState([]);
  const [checkins, setCheckins] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lastSync, setLastSync] = useState(null);

  const fetchData = useCallback(async () => {
    setLoading(true);
    const [r1, r2, r3, r4] = await Promise.all([
      api("study-summary"),
      api("due-today"),
      api("recent-logs"),
      api("checkins"),
    ]);
    if (r1 && !r1.error) setStudyData(r1);
    if (r2?.items) setDueItems(r2.items);
    if (r3?.logs) setLogData(r3.logs);
    if (r4?.checkins) setCheckins(r4.checkins);
    setLastSync(new Date().toLocaleTimeString("ja-JP"));
    setLoading(false);
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  const handleLog = (entry) => {
    setLogData(prev => [{ title:`${entry.subject} - ${entry.note}`, date:entry.date, minutes:entry.minutes, subject:entry.subject }, ...prev]);
  };

  return (
    <div className="wrap">
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div className="mono" style={{fontSize:11,color:"#aaa"}}>{lastSync ? `同步: ${lastSync}` : "加载中..."}</div>
        <button onClick={fetchData} disabled={loading} style={{
          background:loading?"#eee":"#1a1a2e",color:loading?"#999":"#fff",
          border:"none",borderRadius:8,padding:"7px 16px",fontSize:12,cursor:loading?"not-allowed":"pointer",fontWeight:500,
        }}>
          {loading ? "⏳ 同步中..." : "🔄 刷新数据"}
        </button>
      </div>

      <Countdown phase={curPhase()} />
      <Motiv logData={logData} checkins={checkins} />

      <div className="grid">
        <div className="col">
          <Timer onLog={handleLog} />
          <TodayPlan />
          <TodayDue items={dueItems} loading={loading} />
          <Tip />
        </div>
        <div className="col">
          <Progress data={studyData} loading={loading} />
          <Calendar logData={logData} checkins={checkins} />
          <WeeklyPlan />
          <PhaseBar logData={logData} checkins={checkins} />
          <RecentAct logData={logData} />
        </div>
      </div>

      <div style={{textAlign:"center",padding:"20px 0 10px",fontSize:10,color:"#ccc"}}>
        京大社情 Study Dashboard · Built with ♥ for 2026.8
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
